<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>N225f トレンド予測システム</title>

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="トレンド予測">
<meta name="theme-color" content="#080c10">
<link rel="apple-touch-icon" href="icon.jpg">
<link rel="manifest" href="data:application/json,{&quot;name&quot;:&quot;トレンド予測&quot;,&quot;short_name&quot;:&quot;トレンド予測&quot;,&quot;display&quot;:&quot;standalone&quot;,&quot;background_color&quot;:&quot;#080c10&quot;,&quot;theme_color&quot;:&quot;#080c10&quot;}">
<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Noto+Sans+JP:wght@300;400;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #080c10;
    --surface: #111820;
    --surface2: #1a2535;
    --border: #2e4460;
    --bull: #ff3d5a;
    --bear: #00c4ff;
    --neutral: #6b7e95;
    --gold: #f5c842;
    --text: #e8eef5;
    --text-dim: #8aa0b8;
    --font-mono: 'Share Tech Mono', monospace;
    --font-ja: 'Noto Sans JP', sans-serif;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--font-ja);
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* Grid background */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image:
      linear-gradient(rgba(0,196,255,0.03) 1px, transparent 1px),
      linear-gradient(90deg, rgba(0,196,255,0.03) 1px, transparent 1px);
    background-size: 40px 40px;
    pointer-events: none;
    z-index: 0;
  }

  .container {
    position: relative;
    z-index: 1;
    max-width: 480px;
    margin: 0 auto;
    padding: 16px;
  }

  /* Header */
  header {
    text-align: center;
    padding: 20px 0 16px;
    border-bottom: 1px solid var(--border);
    margin-bottom: 20px;
  }

  .header-label {
    font-family: var(--font-mono);
    font-size: 10px;
    letter-spacing: 4px;
    color: var(--text-dim);
    margin-bottom: 6px;
  }

  header h1 {
    font-family: var(--font-mono);
    font-size: 22px;
    color: #fff;
    letter-spacing: 2px;
  }

  header h1 span {
    color: var(--bear);
  }

  .last-update {
    font-family: var(--font-mono);
    font-size: 15px;
    color: var(--text-dim);
    margin-top: 6px;
  }

  .update-row {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    margin-top: 6px;
    line-height: 1;
  }

  .update-row .last-update {
    line-height: 1;
    display: flex;
    align-items: center;
  }

  .update-btn {
    background: transparent;
    border: 1px solid var(--border);
    border-radius: 4px;
    color: var(--text-dim);
    font-family: var(--font-mono);
    font-size: 13px;
    padding: 3px 10px;
    cursor: pointer;
    transition: all 0.2s ease;
    line-height: 1;
  }

  .update-btn:hover {
    border-color: var(--bear);
    color: var(--bear);
  }

  .update-btn:active {
    transform: scale(0.95);
  }

  /* Overall trend badge */
  .trend-banner {
    border-radius: 6px;
    padding: 18px;
    margin-bottom: 16px;
    text-align: center;
    border: 1px solid;
    transition: all 0.5s ease;
    position: relative;
    overflow: hidden;
  }

  .trend-banner::before {
    content: '';
    position: absolute;
    inset: 0;
    opacity: 0.06;
    background: radial-gradient(circle at 50% 0%, currentColor, transparent 70%);
  }

  .trend-banner.bull {
    border-color: var(--bull);
    background: rgba(255,61,90,0.07);
    color: var(--bull);
  }
  .trend-banner.bear {
    border-color: var(--bear);
    background: rgba(0,196,255,0.07);
    color: var(--bear);
  }
  .trend-banner.mixed {
    border-color: var(--gold);
    background: rgba(245,200,66,0.05);
    color: var(--gold);
  }

  .trend-label {
    font-family: var(--font-mono);
    font-size: 10px;
    letter-spacing: 3px;
    opacity: 0.7;
    margin-bottom: 6px;
  }

  .trend-main {
    font-size: 28px;
    font-weight: 700;
    letter-spacing: 1px;
  }

  .trend-sub {
    font-family: var(--font-mono);
    font-size: 11px;
    opacity: 0.6;
    margin-top: 4px;
  }

  /* Price card */
  .price-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 16px;
    margin-bottom: 16px;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
  }

  .price-item {
    text-align: center;
  }

  .price-item-label {
    font-family: var(--font-mono);
    font-size: 9px;
    letter-spacing: 2px;
    color: var(--text-dim);
    margin-bottom: 4px;
  }

  .price-value {
    font-family: var(--font-mono);
    font-size: 20px;
    color: #fff;
  }

  .price-value.up { color: var(--bull); }
  .price-value.down { color: var(--bear); }

  .price-change {
    font-family: var(--font-mono);
    font-size: 11px;
    margin-top: 2px;
  }

  /* Section title */
  .section-title {
    font-family: var(--font-mono);
    font-size: 9px;
    letter-spacing: 3px;
    color: var(--text-dim);
    padding: 0 0 8px;
    border-bottom: 1px solid var(--border);
    margin-bottom: 10px;
  }

  /* MTF Panel */
  .mtf-panel {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 14px;
    margin-bottom: 16px;
  }

  .mtf-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 8px 0;
    border-bottom: 1px solid rgba(30,45,61,0.5);
  }

  .mtf-row:last-child { border-bottom: none; }

  .mtf-tf {
    font-family: var(--font-mono);
    font-size: 11px;
    color: var(--text-dim);
    width: 60px;
  }

  .mtf-bar {
    flex: 1;
    margin: 0 10px;
    height: 4px;
    background: var(--border);
    border-radius: 2px;
    overflow: hidden;
  }

  .mtf-bar-fill {
    height: 100%;
    border-radius: 2px;
    transition: width 0.8s ease, background 0.5s ease;
  }

  .mtf-status {
    font-family: var(--font-mono);
    font-size: 10px;
    font-weight: bold;
    width: 36px;
    text-align: right;
  }

  .mtf-macd {
    font-family: var(--font-mono);
    font-size: 9px;
    color: var(--text-dim);
    width: 60px;
    text-align: right;
  }

  .bull-text { color: var(--bull); }
  .bear-text { color: var(--bear); }
  .neutral-text { color: var(--neutral); }

  /* Color dots */
  .dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    display: inline-block;
    margin-right: 5px;
  }
  .dot.bull { background: var(--bull); box-shadow: 0 0 6px var(--bull); }
  .dot.bear { background: var(--bear); box-shadow: 0 0 6px var(--bear); }
  .dot.neutral { background: var(--neutral); }

  /* Fib panel */
  .fib-panel {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 14px;
    margin-bottom: 16px;
  }

  .fib-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 5px 0;
    font-family: var(--font-mono);
    font-size: 12px;
    border-bottom: 1px solid rgba(30,45,61,0.4);
  }

  .fib-row:last-child { border-bottom: none; }

  .fib-level {
    color: var(--text-dim);
    font-size: 10px;
    width: 50px;
  }

  .fib-price {
    font-size: 14px;
    color: #fff;
  }

  .fib-tag {
    font-size: 9px;
    padding: 2px 6px;
    border-radius: 3px;
    letter-spacing: 1px;
  }

  .fib-tag.target { background: rgba(255,61,90,0.2); color: var(--bull); }
  .fib-tag.support { background: rgba(0,196,255,0.2); color: var(--bear); }
  .fib-tag.current { background: rgba(245,200,66,0.2); color: var(--gold); }
  .fib-tag.resist { background: rgba(255,61,90,0.1); color: rgba(255,61,90,0.6); }

  /* MACD Signal panel */
  .signal-panel {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 14px;
    margin-bottom: 16px;
  }

  .signal-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
  }

  .signal-item {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 10px;
    text-align: center;
  }

  .signal-tf {
    font-family: var(--font-mono);
    font-size: 9px;
    color: var(--text-dim);
    letter-spacing: 2px;
    margin-bottom: 4px;
  }

  .signal-val {
    font-family: var(--font-mono);
    font-size: 11px;
    font-weight: bold;
  }

  /* Score meter */
  .score-panel {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 14px;
    margin-bottom: 16px;
  }

  .score-meter {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-top: 10px;
  }

  .score-label {
    font-family: var(--font-mono);
    font-size: 9px;
    color: var(--bear);
    letter-spacing: 1px;
    width: 30px;
  }

  .score-bar {
    flex: 1;
    height: 20px;
    background: var(--border);
    border-radius: 3px;
    overflow: hidden;
    position: relative;
  }

  .score-bar-bull {
    position: absolute;
    right: 50%;
    top: 0;
    height: 100%;
    background: var(--bull);
    transition: width 1s ease;
    transform-origin: right;
  }

  .score-bar-bear {
    position: absolute;
    left: 50%;
    top: 0;
    height: 100%;
    background: var(--bear);
    transition: width 1s ease;
  }

  .score-center {
    position: absolute;
    left: 50%;
    top: 0;
    width: 2px;
    height: 100%;
    background: rgba(255,255,255,0.3);
    transform: translateX(-50%);
  }

  .score-num {
    font-family: var(--font-mono);
    font-size: 9px;
    color: var(--bull);
    width: 30px;
    text-align: right;
    letter-spacing: 1px;
  }

  /* Refresh button */
  .refresh-btn {
    display: block;
    width: 100%;
    padding: 14px;
    background: transparent;
    border: 1px solid var(--border);
    border-radius: 6px;
    color: var(--text-dim);
    font-family: var(--font-mono);
    font-size: 11px;
    letter-spacing: 3px;
    cursor: pointer;
    transition: all 0.3s ease;
    margin-bottom: 16px;
  }

  .refresh-btn:hover {
    border-color: var(--bear);
    color: var(--bear);
    background: rgba(0,196,255,0.05);
  }

  .refresh-btn:active {
    transform: scale(0.98);
  }

  /* Loading */
  .loading {
    text-align: center;
    padding: 40px;
    font-family: var(--font-mono);
    font-size: 12px;
    color: var(--text-dim);
    letter-spacing: 2px;
  }

  .loading::after {
    content: '';
    display: inline-block;
    width: 6px;
    height: 6px;
    background: var(--bear);
    border-radius: 50%;
    margin-left: 8px;
    animation: blink 0.8s infinite;
  }

  @keyframes blink {
    0%, 100% { opacity: 1; }
    50% { opacity: 0; }
  }

  .error-msg {
    background: rgba(255,61,90,0.1);
    border: 1px solid rgba(255,61,90,0.3);
    border-radius: 6px;
    padding: 14px;
    font-family: var(--font-mono);
    font-size: 11px;
    color: var(--bull);
    text-align: center;
    margin-bottom: 16px;
  }

  /* Candle mini chart */
  .mini-candles {
    display: flex;
    align-items: flex-end;
    gap: 2px;
    height: 50px;
    margin-top: 10px;
    padding: 4px 0;
  }

  .candle-wrap {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    height: 100%;
    justify-content: flex-end;
    position: relative;
  }

  .candle-wick {
    width: 1px;
    background: rgba(255,255,255,0.3);
    position: absolute;
    top: 0;
  }

  .candle-body {
    width: 60%;
    border-radius: 1px;
    min-height: 2px;
  }

  .candle-body.bull { background: var(--bull); }
  .candle-body.bear { background: var(--bear); }

  /* Footer */
  footer {
    text-align: center;
    padding: 20px 0;
    font-family: var(--font-mono);
    font-size: 9px;
    color: var(--text-dim);
    letter-spacing: 2px;
    border-top: 1px solid var(--border);
  }

  footer .disclaimer {
    margin-top: 4px;
    font-size: 8px;
    opacity: 0.5;
  }

  /* Day prediction panel */
  .day-pred-banner {
    border-radius: 6px;
    padding: 14px;
    margin-bottom: 10px;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    border: 1px solid var(--border);
    background: var(--surface2);
  }

  .day-pred-side {
    text-align: center;
    padding: 10px 6px;
    border-radius: 5px;
  }

  .day-pred-side.high-side {
    background: rgba(255,61,90,0.08);
    border: 1px solid rgba(255,61,90,0.25);
  }

  .day-pred-side.low-side {
    background: rgba(0,196,255,0.08);
    border: 1px solid rgba(0,196,255,0.25);
  }

  .day-pred-label {
    font-family: var(--font-mono);
    font-size: 9px;
    letter-spacing: 2px;
    opacity: 0.6;
    margin-bottom: 4px;
  }

  .day-pred-main {
    font-family: var(--font-mono);
    font-size: 22px;
    font-weight: bold;
    line-height: 1;
  }

  .day-pred-main.high { color: var(--bull); }
  .day-pred-main.low  { color: var(--bear); }

  .day-pred-sub {
    font-family: var(--font-mono);
    font-size: 10px;
    opacity: 0.5;
    margin-top: 4px;
  }

  .day-pred-strong {
    font-family: var(--font-mono);
    font-size: 10px;
    margin-top: 5px;
    opacity: 0.75;
  }

  .pred-method-grid {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 6px;
    margin-top: 10px;
  }

  .pred-method-item {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 8px 4px;
    text-align: center;
  }

  .pred-method-name {
    font-family: var(--font-mono);
    font-size: 8px;
    color: var(--text-dim);
    letter-spacing: 1px;
    margin-bottom: 5px;
  }

  .pred-method-h {
    font-family: var(--font-mono);
    font-size: 11px;
    color: var(--bull);
  }

  .pred-method-l {
    font-family: var(--font-mono);
    font-size: 11px;
    color: var(--bear);
    margin-top: 2px;
  }

  .pivot-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 5px 0;
    border-bottom: 1px solid rgba(30,45,61,0.4);
    font-family: var(--font-mono);
    font-size: 11px;
  }
  .pivot-row:last-child { border-bottom: none; }
  .pivot-label { color: var(--text-dim); font-size: 10px; width: 70px; }
  .pivot-val { font-size: 13px; }
  .pivot-dist {
    font-size: 9px;
    padding: 2px 6px;
    border-radius: 3px;
  }

  /* Phoenix: 25MA乖離率パネル */
  .deviation-panel {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 14px;
    margin-bottom: 16px;
  }

  .deviation-gauge {
    margin: 12px 0 8px;
    position: relative;
  }

  .deviation-track {
    height: 10px;
    background: var(--border);
    border-radius: 5px;
    position: relative;
    overflow: visible;
  }

  .deviation-fill {
    height: 100%;
    border-radius: 5px;
    transition: width 0.8s ease, background 0.5s;
    position: absolute;
    left: 50%;
    transform-origin: left;
  }

  .deviation-fill.positive {
    background: linear-gradient(90deg, rgba(255,61,90,0.4), var(--bull));
  }
  .deviation-fill.negative {
    background: linear-gradient(270deg, rgba(0,196,255,0.4), var(--bear));
    left: auto;
    right: 50%;
    transform-origin: right;
  }

  .deviation-center-mark {
    position: absolute;
    left: 50%;
    top: -3px;
    width: 2px;
    height: 16px;
    background: rgba(255,255,255,0.4);
    transform: translateX(-50%);
    border-radius: 1px;
  }

  .deviation-danger-mark {
    position: absolute;
    top: -2px;
    width: 2px;
    height: 14px;
    background: rgba(245,200,66,0.6);
    border-radius: 1px;
  }

  .deviation-big-value {
    font-family: var(--font-mono);
    font-size: 32px;
    font-weight: bold;
    text-align: center;
    margin: 6px 0 2px;
    line-height: 1;
  }

  .deviation-status-badge {
    display: inline-block;
    padding: 4px 12px;
    border-radius: 4px;
    font-family: var(--font-mono);
    font-size: 10px;
    letter-spacing: 2px;
    margin: 4px auto;
  }

  .dev-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 5px 0;
    font-family: var(--font-mono);
    font-size: 11px;
    border-bottom: 1px solid rgba(30,45,61,0.4);
  }
  .dev-row:last-child { border-bottom: none; }
  .dev-label { color: var(--text-dim); font-size: 10px; }

  /* Phoenix: 変化日サイクルパネル */
  .cycle-panel {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 14px;
    margin-bottom: 16px;
  }

  .cycle-timeline {
    display: flex;
    align-items: center;
    margin: 14px 0 10px;
    position: relative;
  }

  .cycle-track {
    flex: 1;
    height: 3px;
    background: var(--border);
    border-radius: 2px;
    position: relative;
  }

  .cycle-progress {
    height: 100%;
    background: linear-gradient(90deg, var(--bear), var(--gold));
    border-radius: 2px;
    transition: width 1s ease;
  }

  .cycle-dot {
    position: absolute;
    top: 50%;
    transform: translate(-50%, -50%);
    width: 10px;
    height: 10px;
    border-radius: 50%;
    border: 2px solid var(--bg);
  }

  .cycle-dot.past { background: var(--text-dim); }
  .cycle-dot.next { background: var(--gold); box-shadow: 0 0 8px var(--gold); }
  .cycle-dot.now  { background: var(--bear); box-shadow: 0 0 8px var(--bear); animation: pulse 1.5s infinite; }

  @keyframes pulse {
    0%, 100% { box-shadow: 0 0 6px var(--bear); }
    50% { box-shadow: 0 0 14px var(--bear); }
  }

  .cycle-label-row {
    display: flex;
    justify-content: space-between;
    font-family: var(--font-mono);
    font-size: 9px;
    color: var(--text-dim);
    margin-top: 6px;
  }

  .cycle-countdown {
    text-align: center;
    margin: 10px 0;
  }

  .cycle-days-num {
    font-family: var(--font-mono);
    font-size: 36px;
    font-weight: bold;
    color: var(--gold);
    line-height: 1;
  }

  .cycle-days-label {
    font-family: var(--font-mono);
    font-size: 10px;
    color: var(--text-dim);
    letter-spacing: 2px;
    margin-top: 4px;
  }

  .cycle-history {
    margin-top: 10px;
  }

  .cycle-hist-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 5px 0;
    border-bottom: 1px solid rgba(30,45,61,0.4);
    font-family: var(--font-mono);
    font-size: 11px;
  }
  .cycle-hist-row:last-child { border-bottom: none; }
  .cycle-hist-date { color: var(--text-dim); font-size: 10px; }
  .cycle-hist-interval { color: var(--gold); }
  .cycle-hist-type { font-size: 9px; padding: 2px 6px; border-radius: 3px; }
  .cycle-hist-type.high { background: rgba(255,61,90,0.15); color: var(--bull); }
  .cycle-hist-type.low  { background: rgba(0,196,255,0.15); color: var(--bear); }


  /* TF個別トレンドバー */
  .tf-trend-bar {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 6px;
    margin-bottom: 14px;
  }

  .tf-trend-cell {
    border-radius: 5px;
    padding: 8px 4px 6px;
    text-align: center;
    border: 1px solid var(--border);
    background: var(--surface);
    cursor: pointer;
    transition: all 0.2s ease;
    position: relative;
  }

  .tf-trend-cell.active-tf {

// =============================================
// データ取得 — corsproxy.io のみ使用（Safari動作確認済み）
// =============================================

async function fetchViaCorsProxy(url) {
  const proxyUrl = 'https://corsproxy.io/?' + encodeURIComponent(url);
  const res = await fetch(proxyUrl, { signal: AbortSignal.timeout(6000) });
  if (!res.ok) throw new Error('HTTP ' + res.status);
  return res.json();
}

async function fetchYahooData(symbol, interval, range) {
  const url = `https://query1.finance.yahoo.com/v8/finance/chart/${symbol}?interval=${interval}&range=${range}&includePrePost=false`;
  const data = await fetchViaCorsProxy(url);
  const closes = data?.chart?.result?.[0]?.indicators?.quote?.[0]?.close?.filter(Boolean) || [];
  if (closes.length < 2) throw new Error('データ不足: ' + symbol);
  data._symbol = symbol;
  return data;
}

function extractTF(data) {
  if (!data) return null;
  const q = data?.chart?.result?.[0]?.indicators?.quote?.[0];
  if (!q) return null;
  const closes = q.close?.filter(Boolean) || [];
  const highs  = q.high?.filter(Boolean)  || closes.map(c => c * 1.002);
  const lows   = q.low?.filter(Boolean)   || closes.map(c => c * 0.998);
  return closes.length > 3 ? { closes, highs, lows, symbol: data._symbol || '?' } : null;
}

function make4H(tf1H) {
  if (!tf1H || tf1H.closes.length < 8) return tf1H;
  const c = [], h = [], l = [];
  for (let i = 0; i + 3 < tf1H.closes.length; i += 4) {
    c.push(tf1H.closes[i+3]);
    h.push(Math.max(...tf1H.highs.slice(i, i+4)));
    l.push(Math.min(...tf1H.lows.slice(i, i+4)));
  }
  return { closes: c, highs: h, lows: l };
}

}


  // 必須データ（日足・1H・15m）を並列取得
  const [d1raw, h1raw, m15raw] = await Promise.all([

    fetchYahooJSONP(mainSym, '1h',  '5d').catch(() => null),

  ]);

  // オプションデータ（失敗しても続行）

  const tf1D  = extractTF(d1raw);

const CYCLE_KEY_BASE = 'n225_cycle_dates';
function getCycleKey() { return `${CYCLE_KEY_BASE}_${BASE_INSTRUMENT}`; }
function loadCycleDates() {

}
function saveCycleDates(arr) {

}

// =============================================
// TRENDLINE DETECTION ENGINE
// =============================================

// Find pivot highs/lows (local extrema)
function findPivots(highs, lows, lookback = 3) {
  const pivotHighs = [];
  const pivotLows = [];
  const n = highs.length;
  for (let i = lookback; i < n - lookback; i++) {
    let isHigh = true, isLow = true;
    for (let j = i - lookback; j <= i + lookback; j++) {
      if (j === i) continue;
      if (highs[j] >= highs[i]) isHigh = false;
      if (lows[j] <= lows[i]) isLow = false;
    }
    if (isHigh) pivotHighs.push({ idx: i, price: highs[i] });
    if (isLow)  pivotLows.push({ idx: i, price: lows[i] });
  }
  return { pivotHighs, pivotLows };
}

// Fit a trendline through two most recent pivots and project to current bar
function projectTrendline(pivots, currentIdx) {
  if (pivots.length < 2) return null;
  const p1 = pivots[pivots.length - 2];
  const p2 = pivots[pivots.length - 1];
  if (p1.idx === p2.idx) return null;
  const slope = (p2.price - p1.price) / (p2.idx - p1.idx);
  const projected = p2.price + slope * (currentIdx - p2.idx);
  return { p1, p2, slope, projected, isRising: slope > 0 };
}

// Check if current price broke through the trendline
function checkBreak(currentClose, trendlineVal, isResistance, atr) {
  const threshold = atr * 0.15; // 15% of ATR as noise filter
  if (isResistance) {
    // Resistance line (drawn through highs)
    if (currentClose > trendlineVal + threshold) return 'break_up';
    if (currentClose < trendlineVal - threshold * 2) return 'intact_below';
    return 'near';
  } else {
    // Support line (drawn through lows)
    if (currentClose < trendlineVal - threshold) return 'break_down';
    if (currentClose > trendlineVal + threshold * 2) return 'intact_above';
    return 'near';
  }
}

function analyzeTrendlines(closes, highs, lows) {
  if (closes.length < 10) return null;
  const atr = calcATR(highs, lows, closes, 10);
  const { pivotHighs, pivotLows } = findPivots(highs, lows, 3);
  const currentIdx = closes.length - 1;
  const currentClose = closes[currentIdx];

  const resistLine = projectTrendline(pivotHighs, currentIdx);
  const supportLine = projectTrendline(pivotLows, currentIdx);

  let resistStatus = null, supportStatus = null;

  if (resistLine) {
    resistStatus = checkBreak(currentClose, resistLine.projected, true, atr);
  }
  if (supportLine) {
    supportStatus = checkBreak(currentClose, supportLine.projected, false, atr);
  }

  // Determine overall trendline situation
  let alert = null;
  if (supportStatus === 'break_down') {
    alert = {
      type: 'break-down',
      icon: '🔵',
      title: 'サポートライン割れ！',
      sub: `サポート: ${Math.round(supportLine.projected).toLocaleString()} を下抜け → 売りセオリーパターン`,
    };
  } else if (resistStatus === 'break_up') {
    alert = {
      type: 'break-up',
      icon: '🔴',
      title: 'レジスタンスライン突破！',
      sub: `抵抗: ${Math.round(resistLine.projected).toLocaleString()} を上抜け → 買いセオリーパターン`,
    };
  } else if (supportStatus === 'near') {
    alert = {
      type: 'intact',
      icon: '⚠️',
      title: 'サポートライン付近',
      sub: `${Math.round(supportLine.projected).toLocaleString()} 付近 — ブレイク監視中`,
    };
  } else if (resistStatus === 'near') {
    alert = {
      type: 'intact',
      icon: '⚠️',
      title: 'レジスタンスライン付近',
      sub: `${Math.round(resistLine.projected).toLocaleString()} 付近 — ブレイク監視中`,
    };
  } else {
    alert = {
      type: 'intact',
      icon: '✅',
      title: 'トレンドライン内側',
      sub: 'ブレイクなし — ライン保持中',
    };
  }

  return {
    resistLine, supportLine,
    resistStatus, supportStatus,
    alert,
    currentClose, atr,
    closes, highs, lows,
    pivotHighs, pivotLows
  };
}

// Draw chart with trendlines on canvas
function drawChart(canvasId, tf, tl, label) {
  const canvas = document.getElementById(canvasId);
  if (!canvas) return;
  const dpr = window.devicePixelRatio || 1;
  const W = canvas.offsetWidth;
  const H = 120;
  canvas.width = W * dpr;
  canvas.height = H * dpr;
  canvas.style.height = H + 'px';
  const ctx = canvas.getContext('2d');
  ctx.scale(dpr, dpr);

  const closes = tf.closes.slice(-40);
  const highs  = tf.highs.slice(-40);
  const lows   = tf.lows.slice(-40);
  const n = closes.length;
  const pad = { l: 6, r: 50, t: 10, b: 18 };
  const cw = W - pad.l - pad.r;
  const ch = H - pad.t - pad.b;

  const allVals = [...highs, ...lows];
  const minV = Math.min(...allVals);
  const maxV = Math.max(...allVals);
  const vRange = maxV - minV || 1;

  const xOf = i => pad.l + (i / (n - 1)) * cw;
  const yOf = v => pad.t + ch - ((v - minV) / vRange) * ch;

  // Background
  ctx.fillStyle = '#0d1117';
  ctx.fillRect(0, 0, W, H);

  // Grid lines
  ctx.strokeStyle = 'rgba(30,45,61,0.5)';
  ctx.lineWidth = 0.5;
  for (let i = 0; i <= 3; i++) {
    const y = pad.t + (ch / 3) * i;
    ctx.beginPath(); ctx.moveTo(pad.l, y); ctx.lineTo(W - pad.r, y); ctx.stroke();
  }

  // Candles
  const barW = Math.max(1, cw / n - 1);
  for (let i = 0; i < n; i++) {
    const x = xOf(i);
    const open = i > 0 ? closes[i-1] : closes[i];
    const close = closes[i];
    const high = highs[i];
    const low = lows[i];
    const bull = close >= open;
    ctx.strokeStyle = ctx.fillStyle = bull ? '#ff3d5a' : '#00c4ff';
    // Wick
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(x, yOf(high));
    ctx.lineTo(x, yOf(low));
    ctx.stroke();
    // Body
    const y1 = yOf(Math.max(open, close));
    const y2 = yOf(Math.min(open, close));
    ctx.fillRect(x - barW/2, y1, barW, Math.max(1, y2 - y1));
  }

  // Draw trendlines
  if (tl) {
    const drawLine = (p1, p2, currentIdx, color, dash) => {
      const startOffset = n - 1 - (closes.length - 1 - p1.idx);
      const endOffset = n - 1;
      const x1 = xOf(Math.max(0, startOffset));
      const x2 = xOf(endOffset);
      const slope = (p2.price - p1.price) / (p2.idx - p1.idx);
      const projected = p2.price + slope * (currentIdx - p2.idx);
      const y1 = yOf(p1.price + slope * (Math.max(0, startOffset) - (n - 1 - (closes.length - 1 - p1.idx))));
      const y2 = yOf(projected);
      ctx.save();
      ctx.strokeStyle = color;
      ctx.lineWidth = 1.5;
      ctx.setLineDash(dash || []);
      ctx.beginPath();
      ctx.moveTo(x1, yOf(p1.price));
      ctx.lineTo(x2, y2);
      ctx.stroke();
      // Price label on right
      ctx.setLineDash([]);
      ctx.fillStyle = color;
      ctx.font = `bold 9px 'Share Tech Mono', monospace`;
      ctx.fillText(Math.round(projected).toLocaleString(), W - pad.r + 3, y2 + 3);
      ctx.restore();
    };

    if (tl.resistLine) drawLine(tl.resistLine.p1, tl.resistLine.p2, closes.length - 1, '#ff3d5a', [4, 3]);
    if (tl.supportLine) drawLine(tl.supportLine.p1, tl.supportLine.p2, closes.length - 1, '#00c4ff', [4, 3]);

    // Current price line
    const cp = closes[closes.length - 1];
    ctx.save();
    ctx.strokeStyle = 'rgba(245,200,66,0.6)';
    ctx.lineWidth = 0.8;
    ctx.setLineDash([2, 3]);
    ctx.beginPath();
    ctx.moveTo(pad.l, yOf(cp));
    ctx.lineTo(W - pad.r, yOf(cp));
    ctx.stroke();
    ctx.fillStyle = '#f5c842';
    ctx.font = `bold 9px 'Share Tech Mono', monospace`;
    ctx.fillText(Math.round(cp).toLocaleString(), W - pad.r + 3, yOf(cp) + 3);
    ctx.restore();
  }

  // Label
  ctx.fillStyle = 'rgba(74,96,112,0.8)';
  ctx.font = `bold 9px 'Share Tech Mono', monospace`;
  ctx.fillText(label, pad.l + 3, pad.t + 10);
}

function calcEMA(closes, period) {
  const k = 2 / (period + 1);
  let ema = closes[0];
  for (let i = 1; i < closes.length; i++) {
    ema = closes[i] * k + ema * (1 - k);
  }
  return ema;
}

function calcMACD(closes) {
  if (closes.length < 26) return { macd: 0, signal: 0, hist: 0, cross: 'FLAT' };
  const ema12 = calcEMA(closes.slice(-12), 12);
  const ema26 = calcEMA(closes.slice(-26), 26);
  const macd = ema12 - ema26;
  // simplified signal
  const signal = calcEMA(closes.slice(-9).map((_, i, a) => {
    const s = closes.slice(-26 + i);
    const e12 = calcEMA(s.slice(-12), 12);
    const e26 = calcEMA(s, 26);
    return e12 - e26;
  }), 9);
  const hist = macd - signal;
  const cross = macd > 0 ? (hist > 0 ? 'GC' : 'GC') : (hist < 0 ? 'DC' : 'DC');
  return { macd, signal, hist, cross: macd > 0 ? 'GC' : 'DC' };
}

function calcSMA(closes, period) {
  if (closes.length < period) return closes[closes.length - 1];
  const slice = closes.slice(-period);
  return slice.reduce((a, b) => a + b, 0) / period;
}

function calcATR(highs, lows, closes, period = 14) {
  const trs = [];
  for (let i = 1; i < closes.length; i++) {
    trs.push(Math.max(highs[i] - lows[i], Math.abs(highs[i] - closes[i-1]), Math.abs(lows[i] - closes[i-1])));
  }
  return trs.slice(-period).reduce((a, b) => a + b, 0) / period;
}

function calcFibs(high, low) {
  const diff = high - low;
  return {
    100: high,
    764: high - diff * 0.236,
    618: high - diff * 0.382,
    500: high - diff * 0.5,
    382: high - diff * 0.618,
    236: high - diff * 0.764,
    0: low
  };
}

function analyzeTF(closes, highs, lows) {
  if (!closes || closes.length < 5) return { bull: false, score: 0, macd: 'N/A' };
  const close = closes[closes.length - 1];
  const sma5 = calcSMA(closes, Math.min(5, closes.length));
  const sma20 = calcSMA(closes, Math.min(20, closes.length));
  const macdData = calcMACD(closes);
  const bull = close > sma5 && sma5 > sma20 && macdData.macd > 0;
  const bear = close < sma5 && sma5 < sma20 && macdData.macd < 0;
  return {
    bull,
    bear,
    macd: macdData.cross,
    macdVal: macdData.macd,
    close,
    sma5,
    sma20
  };
}

// =============================================
// PHOENIX: 25MA 乖離率分析
// =============================================
function calcMADeviation(closes, highs, lows, dangerThreshold = 7.0) {
  const n = closes.length;
  if (n < 25) return null;
  const current = closes[n - 1];

  const ma5  = calcSMA(closes, 5);
  const ma13 = n >= 13 ? calcSMA(closes, 13) : null;
  const ma25 = calcSMA(closes, 25);
  const ma75 = n >= 75 ? calcSMA(closes, 75) : null;

  const dev5  = ((current - ma5)  / ma5)  * 100;
  const dev13 = ma13 ? ((current - ma13) / ma13) * 100 : null;
  const dev25 = ((current - ma25) / ma25) * 100;
  const dev75 = ma75 ? ((current - ma75) / ma75) * 100 : null;

  const devHistory = [];
  for (let i = Math.max(25, n - 20); i < n; i++) {
    const slice = closes.slice(0, i + 1);
    const ma = slice.slice(-25).reduce((a, b) => a + b, 0) / 25;
    devHistory.push(((closes[i] - ma) / ma) * 100);
  }
  const maxDev = Math.max(...devHistory.map(Math.abs));

  const cautionThreshold = dangerThreshold * 0.57; // 約4/7の比率で警戒ライン
  let status, statusColor, statusBg, warning;

  const absDev = Math.abs(dev25);
  if (absDev >= dangerThreshold) {
    status = dev25 > 0 ? '🔴 上方過熱' : '🔵 下方過熱';
    statusColor = dev25 > 0 ? 'var(--bull)' : 'var(--bear)';
    statusBg = dev25 > 0 ? 'rgba(255,61,90,0.15)' : 'rgba(0,196,255,0.15)';
    warning = dev25 > 0 ? '追い買い危険ゾーン — 反落リスク高' : '追い売り危険ゾーン — 反発リスク高';
  } else if (absDev >= cautionThreshold) {
    status = dev25 > 0 ? '⚠️ 上方乖離注意' : '⚠️ 下方乖離注意';
    statusColor = 'var(--gold)';
    statusBg = 'rgba(245,200,66,0.1)';
    warning = dev25 > 0 ? '上昇が続いているが過熱に注意' : '下落が続いているが底打ち意識';
  } else {
    status = '✅ 正常レンジ内';
    statusColor = 'var(--text)';
    statusBg = 'rgba(74,86,104,0.15)';
    warning = 'MAとの乖離は正常範囲内';
  }

  return { current, ma5, ma13, ma25, ma75, dev5, dev13, dev25, dev75,
           status, statusColor, statusBg, warning, dangerThreshold, maxDev };
}

// =============================================
// PHOENIX: 変化日サイクル検出
// =============================================
function calcCycleDays(highs, lows, closes, timestamps, manualDates = []) {
  const n = closes.length;
  const today = new Date();
  today.setHours(0,0,0,0);

  const { pivotHighs, pivotLows } = findPivots(highs, lows, 5);
  const allTurns = [];
  pivotHighs.forEach(p => allTurns.push({ idx: p.idx, price: p.price, type: 'high' }));
  pivotLows.forEach(p  => allTurns.push({ idx: p.idx, price: p.price, type: 'low'  }));
  allTurns.sort((a, b) => a.idx - b.idx);

  // 手動入力：過去日付のみ allTurns に追加（未来日付は別扱い）
  const futureManual = [];
  manualDates.forEach(entry => {
    const d = new Date(entry.date);
    d.setHours(0,0,0,0);
    const diffDays = Math.round((d - today) / 86400000);
    if (diffDays > 0) {
      // 未来日付 → 次の変化日候補として記録
      futureManual.push({ date: d, daysFromNow: diffDays, type: entry.type });
    } else {
      // 過去日付 → allTurns に追加
      const daysAgo = Math.abs(diffDays);
      const idx = Math.max(0, n - 1 - daysAgo);
      allTurns.push({ idx, price: closes[Math.min(idx, closes.length-1)] || closes[n-1],
                      type: entry.type || 'manual', isManual: true, dateStr: entry.date });
    }
  });
  allTurns.sort((a, b) => a.idx - b.idx);

  const intervals = [];
  for (let i = 1; i < allTurns.length; i++) {
    const diff = allTurns[i].idx - allTurns[i-1].idx;
    if (diff > 0 && diff < 60) intervals.push(diff); // 60日超は外れ値除外
  }

  const avgCycle = intervals.length > 0
    ? Math.round(intervals.reduce((a, b) => a + b, 0) / intervals.length)
    : 20;

  const lastTurn = allTurns[allTurns.length - 1];
  const daysSinceLast = lastTurn ? n - 1 - lastTurn.idx : 0;
  let daysToNext = Math.max(0, avgCycle - daysSinceLast);

  // 未来の手動変化日が登録されていれば、それを優先表示
  let nextChangeDate = new Date(today);
  nextChangeDate.setDate(today.getDate() + daysToNext);
  let nextIsManual = false;

  if (futureManual.length > 0) {
    // 最も近い未来の変化日
    futureManual.sort((a, b) => a.daysFromNow - b.daysFromNow);
    const nearest = futureManual[0];
    daysToNext = nearest.daysFromNow;
    nextChangeDate = nearest.date;
    nextIsManual = true;
  }

  const isNearChangeDay = daysToNext <= 3;

  const history = allTurns.slice(-6).map((t, i, arr) => {
    const interval = i > 0 ? t.idx - arr[i-1].idx : null;
    const daysAgo  = n - 1 - t.idx;
    const d = new Date(today);
    d.setDate(today.getDate() - daysAgo);
    return { date: t.dateStr || `${d.getMonth()+1}/${d.getDate()}`,
             type: t.type, interval, price: Math.round(t.price), isManual: t.isManual };
  });

  // 未来の変化日も履歴的に表示
  const futureHistory = futureManual.map(f => ({
    date: `${f.date.getMonth()+1}/${f.date.getDate()}`,
    type: f.type, interval: null, price: null, isManual: true, isFuture: true,
    daysFromNow: f.daysFromNow
  }));

  return { avgCycle, daysSinceLast, daysToNext, nextChangeDate, isNearChangeDay,
           lastTurn, history, futureHistory, nextIsManual, allTurns };
}

function switchDevDisplay(period, maVal, devVal) {
  const label = document.getElementById('devPeriodLabel');
  const big   = document.getElementById('devBigValue');
  const fill  = document.getElementById('devGaugeFill');
  if (!label || !big) return;
  const dev = parseFloat(devVal);
  label.textContent = `${period}日MA`;
  big.textContent = (dev > 0 ? '+' : '') + dev.toFixed(2) + '%';
  big.style.color = dev > 0 ? 'var(--bull)' : 'var(--bear)';
  if (fill) {
    fill.style.width = Math.min(50, Math.abs(dev) / 7.0 * 42) + '%';
    fill.className = 'deviation-fill ' + (dev >= 0 ? 'positive' : 'negative');
  }
}

  const dateEl = document.getElementById('cycleDate');
  const typeEl = document.getElementById('cycleType');
  if (!dateEl || !dateEl.value) return;
  const dates = loadCycleDates();
  // 重複チェック
  if (dates.find(d => d.date === dateEl.value)) {
    alert('その日付はすでに登録されています');
    return;
  }
  dates.push({ date: dateEl.value, type: typeEl.value });
  dates.sort((a, b) => a.date.localeCompare(b.date));
  saveCycleDates(dates);
  renderCycleDateList();
  loadData(); // 再計算
}

function removeCycleDate(dateStr) {
  const dates = loadCycleDates().filter(d => d.date !== dateStr);
  saveCycleDates(dates);
  loadData();
}

function renderCycleDateList() {
  const el = document.getElementById('cycleDateList');
  if (!el) return;
  const dates = loadCycleDates();
  if (dates.length === 0) {
    el.innerHTML = '<div style="font-family:var(--font-mono);font-size:9px;color:var(--text-dim)">登録なし</div>';
    return;
  }
  el.innerHTML = dates.map(d => `
    <div style="display:flex;justify-content:space-between;align-items:center;padding:4px 0;border-bottom:1px solid rgba(30,45,61,0.4);font-family:var(--font-mono);font-size:10px">
      <span style="color:${d.type==='high'?'var(--bull)':'var(--bear)'}">${d.type==='high'?'🔴':'🔵'} ${d.date}</span>
      <button onclick="removeCycleDate('${d.date}')" style="background:none;border:none;color:var(--text-dim);cursor:pointer;font-size:12px;padding:0 4px">✕</button>
    </div>`).join('');
}

loadData();
// 初期リスト描画（app描画後）
setTimeout(renderCycleDateList, 1000);
</script>
</body>
</html>
