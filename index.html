
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="チャート作図">
<link rel="apple-touch-icon" href="icon.jpg">
<title>チャート作図</title>
<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0a0a0a;--surface:#181818;--border:#1e2530;
  --text:#e8e8e8;--dim:#4a5a6e;--mono:'Share Tech Mono',monospace;
  --bull:#ff3d5a;--bear:#00c4ff;--gold:#f5c842;
  --toolbar-bg:rgba(8,10,13,.97);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
body{background:var(--bg);color:var(--text);font-family:var(--mono);overflow-x:hidden;}
#charts{overflow-y:auto;}
.cfg-sec{font-size:10px;color:#888;letter-spacing:2px;margin-bottom:8px;padding-top:4px;}
.cfg-pal-cnt{height:30px;min-width:32px;padding:0 8px;border-radius:4px;border:1px solid #333;
  background:#222;color:#888;font-family:var(--mono);font-size:12px;cursor:pointer;}
.cfg-pal-cnt.active{border-color:var(--gold);color:var(--gold);}
.cfg-row{display:flex;align-items:center;gap:10px;padding:8px 10px;background:#222;
  border:1px solid #333;border-radius:5px;margin-bottom:6px;}
.cfg-label{font-size:12px;color:#ccc;flex:1;}
.cfg-range{flex:1;accent-color:var(--gold);}
.cfg-drag{color:#555;cursor:grab;font-size:16px;padding:0 4px;}

#toolbar{
  position:sticky;top:0;z-index:100;
  background:var(--toolbar-bg);backdrop-filter:blur(10px);
  border-bottom:1px solid var(--border);
  padding:8px 10px;display:flex;flex-direction:column;gap:7px;
}
.tb-row{display:flex;align-items:center;gap:6px;flex-wrap:wrap;}
.tb-btn{
  height:34px;padding:0 11px;border-radius:5px;border:1px solid var(--border);
  background:var(--surface);color:var(--dim);font-family:var(--mono);font-size:12px;
  cursor:pointer;white-space:nowrap;transition:all .15s;user-select:none;
}
.tb-btn.active{background:rgba(245,200,66,.15);border-color:var(--gold);color:var(--gold);}
.tb-btn.del-mode{background:rgba(255,61,90,.15);border-color:var(--bull);color:var(--bull);}
.tb-btn.disabled{opacity:.35;pointer-events:none;}
.sym-btn{height:34px;padding:0 13px;border-radius:5px;border:1px solid var(--border);
  background:var(--surface);color:var(--dim);font-family:var(--mono);font-size:12px;cursor:pointer;}
.sym-btn.active{background:rgba(245,200,66,.12);border-color:var(--gold);color:var(--gold);}
.tb-sep{width:1px;height:26px;background:var(--border);flex-shrink:0;}
.color-dot{width:24px;height:24px;border-radius:50%;cursor:pointer;
  border:2px solid transparent;flex-shrink:0;}
.color-dot.active{border-color:#fff;box-shadow:0 0 0 1px rgba(255,255,255,.5);}
.sty-btn{height:26px;padding:0 9px;border-radius:3px;border:1px solid var(--border);
  background:var(--surface);color:var(--dim);font-family:var(--mono);font-size:11px;cursor:pointer;}
.sty-btn.active{border-color:var(--gold);color:var(--gold);}

/* Tool icons larger, same color as sym select */
.tool-icon{font-size:18px !important;padding:0 10px !important;color:#e8e8e8 !important;}
.tb-btn[data-tool].active{color:var(--gold) !important;}

/* Refresh/Undo/Redo icons */
.icon-btn{font-size:21px;padding:0 10px;color:#e8e8e8;}
.icon-btn.disabled{opacity:.3;pointer-events:none;}

/* Palette slots */
.pal-slot{width:26px;height:26px;border-radius:50%;cursor:pointer;flex-shrink:0;
  border:2px solid transparent;position:relative;transition:border-color .15s;}
.pal-slot.active{border-color:#fff;box-shadow:0 0 0 1px rgba(255,255,255,.5);}
.pal-slot::after{content:'✎';position:absolute;inset:0;display:flex;align-items:center;
  justify-content:center;font-size:10px;color:rgba(255,255,255,.5);opacity:0;}
.pal-slot:active::after{opacity:1;}
.tb-sel{height:34px;padding:0 10px;border-radius:5px;border:1px solid var(--border);
  background:var(--surface);color:#eef4ff;font-family:var(--mono);font-size:12px;
  cursor:pointer;color-scheme:dark;}

.chart-wrap{position:relative;border-bottom:2px solid #3a3a3a;overflow:hidden;}
canvas{display:block;width:100%;touch-action:pan-y;}
.price-tag{position:absolute;right:0;font-size:10px;font-family:var(--mono);
  background:var(--gold);color:#000;padding:1px 5px;border-radius:2px 0 0 2px;
  pointer-events:none;z-index:5;transform:translateY(-50%);font-weight:bold;}
.tf-label{position:absolute;top:6px;left:8px;font-size:10px;color:#e8e8e8;
  background:rgba(8,10,13,.8);padding:2px 6px;border-radius:2px;pointer-events:none;z-index:5;}

/* Toast */
#toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);
  background:rgba(245,200,66,.15);border:1px solid var(--gold);color:var(--gold);
  font-family:var(--mono);font-size:12px;padding:8px 16px;border-radius:20px;
  z-index:500;opacity:0;transition:opacity .3s;pointer-events:none;white-space:nowrap;}
#toast.show{opacity:1;}
</style>
</head>
<body>
<div id="toolbar">
  <!-- Row 1: Symbol + Tools -->
  <div class="tb-row">
    <select class="tb-sel" id="symSel" onchange="setSym(this.value)" style="width:88px">
      <option value="NKD=F">225先物</option>
      <option value="1570.T">1570</option>
      <option value="1579.T">1579</option>
    </select>
    <div class="tb-sep"></div>
    <button class="tb-btn active" data-tool="pan" onclick="setTool(this)" title="移動">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="#e8e8e8" stroke-width="1.4" stroke-linecap="round">
        <path d="M8 1v14M1 8h14M8 1l-2 3M8 1l2 3M8 15l-2-3M8 15l2-3M1 8l3-2M1 8l3 2M15 8l-3-2M15 8l-3 2"/>
      </svg>
    </button>
    <button class="tb-btn tool-icon" data-tool="line" onclick="setTool(this)">╱</button>
    <button class="tb-btn tool-icon" data-tool="hline" onclick="setTool(this)">―</button>
    <button class="tb-btn tool-icon" data-tool="channel" onclick="setTool(this)">⫛</button>
    <div class="tb-sep"></div>
    <button class="tb-btn" id="btnDel" onclick="toggleDelMode()" title="削除">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="#e8e8e8" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
        <path d="M2 4h12M5 4V2h6v2M6 7v5M10 7v5M3 4l1 9h8l1-9"/>
      </svg>
    </button>
    <button class="tb-btn" onclick="openSettings()" title="設定">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="#e8e8e8" stroke-width="1.4" stroke-linecap="round">
        <circle cx="8" cy="8" r="2.5"/>
        <path d="M8 1v2M8 13v2M1 8h2M13 8h2M3.1 3.1l1.4 1.4M11.5 11.5l1.4 1.4M3.1 12.9l1.4-1.4M11.5 4.5l1.4-1.4"/>
      </svg>
    </button>
  </div>
  <!-- Row 2: Palette + Style -->
  <div class="tb-row">
    <div class="pal-slot active" id="pal0"></div>
    <div class="pal-slot" id="pal1"></div>
    <div class="pal-slot" id="pal2"></div>
    <div class="pal-slot" id="pal3"></div>
    <div class="pal-slot" id="pal4"></div>
    <div class="pal-slot" id="pal5" style="display:none"></div>
    <div class="pal-slot" id="pal6" style="display:none"></div>
    <div class="pal-slot" id="pal7" style="display:none"></div>
    <div class="pal-slot" id="pal8" style="display:none"></div>
    <div class="pal-slot" id="pal9" style="display:none"></div>
    <input type="color" id="palPicker" style="width:0;height:0;opacity:0;position:absolute">
    <div class="tb-sep"></div>
    <button class="sty-btn active" data-sty="solid" onclick="setStyle(this)">実線</button>
    <button class="sty-btn" data-sty="dash" onclick="setStyle(this)">点線</button>
  </div>
  <!-- Row 3: AutoRefresh + Refresh + Time + Undo/Redo -->
  <div class="tb-row">
    <select class="tb-sel" id="autoSel" onchange="setAuto(this.value)" style="width:76px">
      <option value="0">手動</option>
      <option value="30">30秒</option>
      <option value="60">1分</option>
      <option value="180">3分</option>
      <option value="300">5分</option>
    </select>
    <button class="tb-btn icon-btn" onclick="loadAll()">↻</button>
    <span id="updTime" style="font-size:16px;color:#e8e8e8;min-width:48px">---</span>
    <div class="tb-sep"></div>
    <button class="tb-btn icon-btn disabled" id="btnUndo" onclick="undo()">↩</button>
    <button class="tb-btn icon-btn disabled" id="btnRedo" onclick="redo()">↪</button>
  </div></div>

<div id="charts">
  <div class="chart-wrap" id="wrap_1h"><div class="tf-label">60分足</div><canvas id="cv_1h"></canvas><div class="price-tag" id="tag_1h"></div></div>
  <div class="chart-wrap" id="wrap_15m"><div class="tf-label">15分足</div><canvas id="cv_15m"></canvas><div class="price-tag" id="tag_15m"></div></div>
  <div class="chart-wrap" id="wrap_5m"><div class="tf-label">5分足</div><canvas id="cv_5m"></canvas><div class="price-tag" id="tag_5m"></div></div>
</div>

<div id="toast"></div>

<!-- Settings Panel -->
<div id="settingsOverlay" style="display:none;position:fixed;inset:0;z-index:300;background:rgba(0,0,0,.7)" onclick="closeSettings()"></div>
<div id="settingsPanel" style="display:none;position:fixed;top:0;right:0;bottom:0;z-index:301;width:min(320px,90vw);background:#1a1a1a;border-left:1px solid #333;overflow-y:auto;padding:16px;">
  <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;border-bottom:1px solid #333;padding-bottom:12px;">
    <div style="font-size:11px;letter-spacing:3px;color:#888">設定</div>
    <button onclick="closeSettings()" style="background:none;border:none;color:#888;font-size:20px;cursor:pointer">✕</button>
  </div>

  <!-- Toolbar BG Color -->
  <div class="cfg-sec">ツールバー背景色</div>
  <div style="display:flex;align-items:center;gap:10px;margin-bottom:16px;">
    <input type="color" id="cfgToolbarBg" value="#0a0a0a" onchange="applyToolbarBg(this.value)"
      style="width:36px;height:36px;border:none;border-radius:6px;cursor:pointer;padding:2px;">
    <div style="font-size:12px;color:#888">タップで色を変更</div>
  </div>

  <!-- Palette count -->
  <div class="cfg-sec">パレット色数</div>
  <div style="display:flex;gap:6px;margin-bottom:16px;flex-wrap:wrap;">
    <script>for(let i=3;i<=10;i++) document.write('<button class="cfg-pal-cnt" data-n="'+i+'" onclick="setPalCount('+i+')">'+i+'</button>');</script>
  </div>

  <!-- Palette colors -->
  <div class="cfg-sec">パレット色カスタム</div>
  <div id="cfgPalList" style="display:flex;flex-direction:column;gap:8px;margin-bottom:16px;"></div>

  <!-- Chart order -->
  <div class="cfg-sec">チャート表示順</div>
  <div id="cfgChartOrder" style="margin-bottom:16px;"></div>

  <!-- Chart heights -->
  <div class="cfg-sec">チャート縦幅</div>
  <div id="cfgChartHeights" style="margin-bottom:16px;"></div>

  <!-- Candle count -->
  <div class="cfg-sec">ローソク足表示本数</div>
  <div id="cfgCandleCount" style="margin-bottom:16px;"></div>
</div>

<script>
// ===== CONFIG =====
const TFS=[
  {id:'1h', label:'60分足', interval:'1h',  range:'5d', h:198},
  {id:'15m',label:'15分足', interval:'15m', range:'2d', h:186},
  {id:'5m', label:'5分足',  interval:'5m',  range:'1d', h:186},
];
const PAD={l:4,r:54,t:10,b:18};

// ===== STATE =====
let SYM='NKD=F', TOOL='pan', COLOR='#ffffff', STYLE='solid';
let DATA={};
let LINES=[];
let UNDO_STACK=[], REDO_STACK=[];
let DRAW=null;
let SELECTED=null; // selected line id for move
let DEL_MODE=false;

// Per-chart view state (pan/zoom)
const VIEW={}; // tfId → {offsetT, scaleT, offsetP, scaleP}

// ===== STORAGE =====
function storageKey(){ return 'n225_lines_v4_'+SYM; }
function saveLines(){ try{ localStorage.setItem(storageKey(),JSON.stringify(LINES)); }catch{} }
function loadLines(){ try{ LINES=JSON.parse(localStorage.getItem(storageKey())||'[]'); }catch{ LINES=[]; } }

// ===== UNDO/REDO =====
function pushUndo(){
  UNDO_STACK.push(JSON.stringify(LINES));
  REDO_STACK=[];
  updateUndoButtons();
}
function undo(){
  if(!UNDO_STACK.length) return;
  REDO_STACK.push(JSON.stringify(LINES));
  LINES=JSON.parse(UNDO_STACK.pop());
  saveLines(); renderAll(); updateUndoButtons();
}
function redo(){
  if(!REDO_STACK.length) return;
  UNDO_STACK.push(JSON.stringify(LINES));
  LINES=JSON.parse(REDO_STACK.pop());
  saveLines(); renderAll(); updateUndoButtons();
}
function updateUndoButtons(){
  document.getElementById('btnUndo').classList.toggle('disabled',!UNDO_STACK.length);
  document.getElementById('btnRedo').classList.toggle('disabled',!REDO_STACK.length);
}

// ===== FETCH =====
async function fetchYahoo(sym,interval,range){
  const url='https://query1.finance.yahoo.com/v8/finance/chart/'
    +encodeURIComponent(sym)+'?interval='+interval+'&range='+range+'&includePrePost=false';
  const ctrl=new AbortController();
  const t=setTimeout(()=>ctrl.abort(),9000);
  try{
    const r=await fetch('https://corsproxy.io/?'+encodeURIComponent(url),{signal:ctrl.signal});
    clearTimeout(t);
    if(!r.ok) return null;
    const j=await r.json();
    const res=j?.chart?.result?.[0];
    const q=res?.indicators?.quote?.[0];
    const ts=res?.timestamp||[];
    if(!q||!ts.length) return null;
    const bars=[];
    for(let i=0;i<ts.length;i++){
      const c=q.close?.[i],h=q.high?.[i],l=q.low?.[i],o=q.open?.[i];
      if(c!=null&&h!=null&&l!=null) bars.push({t:ts[i],o:o||c,h,l,c});
    }
    return bars.length>=2?bars:null;
  }catch{ clearTimeout(t); return null; }
}

// ===== LOAD =====
async function loadAll(){
  document.getElementById('updTime').textContent='取得中...';
  const res=await Promise.allSettled(TFS.map(tf=>fetchYahoo(SYM,tf.interval,tf.range)));
  TFS.forEach((tf,i)=>{ DATA[tf.id]=res[i].value||null; VIEW[tf.id]={offsetT:0,scaleT:1,offsetP:0,scaleP:1}; });
  loadLines();
  renderAll();
  const n=new Date();
  document.getElementById('updTime').textContent=n.getHours()+':'+String(n.getMinutes()).padStart(2,'0');
}
function setSym(val){
  SYM=val;
  localStorage.setItem('sym',val);
  loadAll();
}

let _autoTimer=null;
function setAuto(sec){
  if(_autoTimer){ clearInterval(_autoTimer); _autoTimer=null; }
  localStorage.setItem('auto_refresh',sec);
  if(parseInt(sec)>0) _autoTimer=setInterval(loadAll,parseInt(sec)*1000);
}

// restore saved sym/auto
const _savedSym=localStorage.getItem('sym')||'NKD=F';
SYM=_savedSym;
document.getElementById('symSel').value=_savedSym;
const _savedAuto=localStorage.getItem('auto_refresh')||'0';
document.getElementById('autoSel').value=_savedAuto;
if(parseInt(_savedAuto)>0) _autoTimer=setInterval(loadAll,parseInt(_savedAuto)*1000);

// ===== SCALE =====
function getScale(tfId){
  const bars=DATA[tfId]; if(!bars||bars.length<2) return null;
  const tf=TFS.find(t=>t.id===tfId);
  const cv=document.getElementById('cv_'+tfId);
  const W=cv.offsetWidth||window.innerWidth, H=tf.h;
  const cw=W-PAD.l-PAD.r, ch=H-PAD.t-PAD.b;
  const v=VIEW[tfId]||{offsetT:0,scaleT:1,offsetP:0,scaleP:1};

  const rawMinT=bars[0].t, rawMaxT=bars[bars.length-1].t;
  const rawTR=rawMaxT-rawMinT||1;
  // Apply time zoom and pan
  const visibleTR=rawTR/v.scaleT;
  const midT=(rawMinT+rawMaxT)/2 + v.offsetT;
  const minT=midT-visibleTR/2, maxT=midT+visibleTR/2;

  // Apply price zoom and pan
  const rawMinP=Math.min(...bars.map(b=>b.l));
  const rawMaxP=Math.max(...bars.map(b=>b.h));
  const rawVR=rawMaxP-rawMinP||1;
  const visibleVR=rawVR/(v.scaleP||1);
  const midP=(rawMinP+rawMaxP)/2 + (v.offsetP||0);
  const minP=midP-visibleVR/2, maxP=midP+visibleVR/2;
  const vr=maxP-minP||1;
  return {bars,W,H,cw,ch,minP,maxP,vr,minT,maxT,tr:maxT-minT||1};
}
function priceToY(p,sc){ return PAD.t+sc.ch-(p-sc.minP)/sc.vr*sc.ch; }
function timeToX(t,sc){ return PAD.l+(t-sc.minT)/sc.tr*sc.cw; }
function xToTime(x,sc){ return sc.minT+(x-PAD.l)/sc.cw*sc.tr; }
function yToPrice(y,sc){ return sc.maxP-(y-PAD.t)/sc.ch*sc.vr; }

// ===== RENDER =====
function renderAll(){ TFS.forEach(tf=>renderChart(tf.id)); }

function renderChart(tfId){
  const cv=document.getElementById('cv_'+tfId);
  const tf=TFS.find(t=>t.id===tfId);
  if(!cv||!tf) return;
  const dpr=window.devicePixelRatio||1;
  const W=cv.offsetWidth||window.innerWidth, H=tf.h;
  cv.width=W*dpr; cv.height=H*dpr; cv.style.height=H+'px';
  const ctx=cv.getContext('2d');
  ctx.scale(dpr,dpr);
  ctx.fillStyle='#080a0d'; ctx.fillRect(0,0,W,H);

  const bars=DATA[tfId];
  if(!bars){ ctx.fillStyle='#777777'; ctx.font='12px Share Tech Mono'; ctx.textAlign='center'; ctx.fillText('データ取得中...',W/2,H/2); return; }
  const sc=getScale(tfId); if(!sc) return;

  // grid
  ctx.strokeStyle='rgba(50,50,50,.7)'; ctx.lineWidth=.5;
  for(let i=0;i<=4;i++){
    const yy=PAD.t+(sc.ch/4)*i;
    ctx.beginPath(); ctx.moveTo(PAD.l,yy); ctx.lineTo(W-PAD.r,yy); ctx.stroke();
    const p=sc.maxP-(sc.vr/4)*i;
    ctx.fillStyle='#777777'; ctx.font='9px Share Tech Mono'; ctx.textAlign='left';
    ctx.fillText(Math.round(p).toLocaleString(),W-PAD.r+3,yy+3);
  }

  // candles
  const totalBars = bars.length;
  const bwFull = sc.cw / totalBars;
  const bw = Math.max(1.5, bwFull * 0.6);
  bars.forEach((bar,i)=>{
    const cx = timeToX(bar.t, sc);
    if(cx < PAD.l - bw*2 || cx > W - PAD.r + bw*2) return;
    const bull = bar.c >= bar.o;
    ctx.strokeStyle = ctx.fillStyle = bull ? '#ff3d5a' : '#00c4ff';
    ctx.lineWidth = Math.min(1, bwFull * 0.4);
    // wick
    ctx.beginPath(); ctx.moveTo(cx, priceToY(bar.h,sc)); ctx.lineTo(cx, priceToY(bar.l,sc)); ctx.stroke();
    // body - only draw as rect if wide enough
    const y1 = priceToY(Math.max(bar.o,bar.c),sc);
    const y2 = priceToY(Math.min(bar.o,bar.c),sc);
    const bodyH = Math.max(1, y2-y1);
    if(bw >= 2) {
      ctx.fillRect(cx - bw/2, y1, bw, bodyH);
    } else {
      // too narrow: just color the wick differently
      ctx.strokeStyle = bull ? '#ff3d5a' : '#00c4ff';
      ctx.lineWidth = Math.max(1, bw);
      ctx.beginPath(); ctx.moveTo(cx, y1); ctx.lineTo(cx, y2); ctx.stroke();
    }
  });

  // current price
  const cur=bars.at(-1).c;
  ctx.strokeStyle='rgba(245,200,66,.4)'; ctx.lineWidth=.7; ctx.setLineDash([3,4]);
  ctx.beginPath(); ctx.moveTo(PAD.l,priceToY(cur,sc)); ctx.lineTo(W-PAD.r,priceToY(cur,sc)); ctx.stroke();
  ctx.setLineDash([]);
  const tag=document.getElementById('tag_'+tfId);
  if(tag){ tag.textContent=Math.round(cur).toLocaleString(); tag.style.top=priceToY(cur,sc)+'px'; }

  // saved lines
  LINES.forEach(line=>{
    const isSel=SELECTED===line.id;
    drawLine(ctx,line,sc,W,H,false,isSel);
  });
  // in-progress
  if(DRAW&&DRAW.tfId===tfId) drawLine(ctx,DRAW,sc,W,H,true,false);

  // DEL MODE overlay hint
  if(DEL_MODE){
    ctx.fillStyle='rgba(255,61,90,.06)';
    ctx.fillRect(0,0,W,H);
  }
}

function drawLine(ctx,line,sc,W,H,preview,selected){
  ctx.save();
  ctx.strokeStyle=line.color||'#fff';
  ctx.lineWidth=selected?1.5:0.8;
  ctx.globalAlpha=preview?0.6:1;
  if(selected){ ctx.shadowColor=line.color; ctx.shadowBlur=6; }
  ctx.setLineDash(line.style==='dash'?[5,4]:[]);

  if(line.type==='hline'){
    const y=priceToY(line.p1Price,sc);
    if(y<PAD.t-4||y>PAD.t+sc.ch+4){ ctx.restore(); return; }
    ctx.beginPath(); ctx.moveTo(PAD.l,y); ctx.lineTo(W-PAD.r,y); ctx.stroke();
    ctx.font='9px Share Tech Mono'; ctx.fillStyle=line.color; ctx.globalAlpha=.8; ctx.textAlign='left';
    ctx.fillText(Math.round(line.p1Price).toLocaleString(),W-PAD.r+3,y+3);

  } else if(line.type==='line'){
    const x1=timeToX(line.p1Time,sc),y1=priceToY(line.p1Price,sc);
    const x2=timeToX(line.p2Time,sc),y2=priceToY(line.p2Price,sc);
    ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(x2,y2); ctx.stroke();
    // endpoint handles when selected
    if(selected){
      ctx.setLineDash([]); ctx.globalAlpha=1;
      [x1,x2].forEach((ex,i)=>{
        const ey=i===0?y1:y2;
        ctx.beginPath(); ctx.arc(ex,ey,6,0,Math.PI*2);
        ctx.fillStyle=line.color; ctx.fill();
        ctx.strokeStyle='#fff'; ctx.lineWidth=1.2; ctx.stroke();
      });
      // Channel parallel line handles
      if(line.type==='channel'&&line.phase===2){
        const offPx=(line.p3Price-line.p1Price)*sc.ch/sc.vr;
        [[x1,y1-offPx],[x2,y2-offPx]].forEach(([ex,ey])=>{
          ctx.beginPath(); ctx.arc(ex,ey,5,0,Math.PI*2);
          ctx.fillStyle='rgba(255,255,255,.3)'; ctx.fill();
          ctx.strokeStyle=line.color; ctx.lineWidth=1.2; ctx.stroke();
        });
      }
    }

  } else if(line.type==='channel'){
    const x1=timeToX(line.p1Time,sc),y1=priceToY(line.p1Price,sc);
    const x2=timeToX(line.p2Time,sc),y2=priceToY(line.p2Price,sc);
    ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(x2,y2); ctx.stroke();
    if(line.phase===1){ ctx.restore(); return; } // phase1: only first line
    const offPx=(line.p3Price-line.p1Price)*sc.ch/sc.vr;
    ctx.beginPath(); ctx.moveTo(x1,y1-offPx); ctx.lineTo(x2,y2-offPx); ctx.stroke();
    ctx.globalAlpha=0.07; ctx.fillStyle=line.color;
    ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(x2,y2); ctx.lineTo(x2,y2-offPx); ctx.lineTo(x1,y1-offPx); ctx.closePath(); ctx.fill();
  }
  ctx.setLineDash([]); ctx.restore();
}

// ===== HIT TEST =====
function hitTest(line,x,y,sc,thresh=14){
  if(line.type==='hline'){
    const ly=priceToY(line.p1Price,sc);
    return Math.abs(y-ly)<thresh;
  } else if(line.type==='line'||line.type==='channel'){
    const x1=timeToX(line.p1Time,sc),y1=priceToY(line.p1Price,sc);
    const x2=timeToX(line.p2Time,sc),y2=priceToY(line.p2Price,sc);
    // distance from point to segment
    const dx=x2-x1,dy=y2-y1,len2=dx*dx+dy*dy;
    if(len2===0) return Math.hypot(x-x1,y-y1)<thresh;
    const t=Math.max(0,Math.min(1,((x-x1)*dx+(y-y1)*dy)/len2));
    const px=x1+t*dx,py=y1+t*dy;
    if(Math.hypot(x-px,y-py)<thresh) return true;
    // also check parallel line for channel
    if(line.type==='channel'&&line.phase===2){
      const offPx=(line.p3Price-line.p1Price)*sc.ch/sc.vr;
      const py2=y1-offPx+t*dy;
      if(Math.hypot(x-(x1+t*dx),y-py2)<thresh) return true;
    }
    return false;
  }
  return false;
}

// ===== TOUCH HANDLING =====
TFS.forEach(tf=>{
  const cv=document.getElementById('cv_'+tf.id);
  if(!cv) return;

  let panStart=null, pinchDist0=null, pinchMid0=null, pinchDx0=null, pinchDy0=null, movingLine=null, moveStart=null;

  function getPos(e){
    const rect=cv.getBoundingClientRect();
    const src=e.touches?e.touches[0]:e;
    return {x:src.clientX-rect.left,y:src.clientY-rect.top};
  }
  function getPinchDist(e){
    if(!e.touches||e.touches.length<2) return null;
    const r=cv.getBoundingClientRect();
    const t1=e.touches[0],t2=e.touches[1];
    return Math.hypot(t1.clientX-t2.clientX,t1.clientY-t2.clientY);
  }
  function getMidPos(e){
    if(!e.touches||e.touches.length<2) return null;
    const r=cv.getBoundingClientRect();
    return {x:(e.touches[0].clientX+e.touches[1].clientX)/2-r.left,
            y:(e.touches[0].clientY+e.touches[1].clientY)/2-r.top};
  }

  function onStart(e){
    e.preventDefault();
    // Initialize pinch data immediately for any 2-finger touch
    if(e.touches&&e.touches.length>=2){
      pinchDist0=getPinchDist(e);
      pinchDx0=Math.abs(e.touches[0].clientX-e.touches[1].clientX);
      pinchDy0=Math.abs(e.touches[0].clientY-e.touches[1].clientY);
      return;
    }
    const pos=getPos(e);
    const sc=getScale(tf.id); if(!sc) return;

    // DEL MODE: tap to delete
    if(DEL_MODE){
      const hit=LINES.slice().reverse().find(l=>hitTest(l,pos.x,pos.y,sc));
      if(hit){ pushUndo(); LINES=LINES.filter(l=>l.id!==hit.id); saveLines(); renderAll(); toast('ライン削除'); }
      return;
    }

    // PAN MODE
    if(TOOL==='pan'){
      // Check endpoint hit first (for angle editing)
      let epHit=null, epLine=null;
      for(let i=LINES.length-1;i>=0;i--){
        const ep=findEndpointHit(LINES[i],pos.x,pos.y,sc);
        if(ep){ epHit=ep; epLine=LINES[i]; break; }
      }
      if(epHit&&epLine){
        SELECTED=epLine.id;
        movingLine={...epLine, _ep:epHit};
        moveStart={x:pos.x,y:pos.y,t:xToTime(pos.x,sc),p:yToPrice(pos.y,sc)};
        renderAll(); return;
      }
      // Check full line hit for move
      const hit=LINES.slice().reverse().find(l=>hitTest(l,pos.x,pos.y,sc));
      if(hit){
        SELECTED=hit.id;
        movingLine={...hit};
        moveStart={x:pos.x,y:pos.y,t:xToTime(pos.x,sc),p:yToPrice(pos.y,sc)};
        renderAll(); return;
      }
      SELECTED=null;
      panStart={x:pos.x, t:xToTime(pos.x,sc), p:yToPrice(pos.y,sc), scaleT:(VIEW[tf.id]||{scaleT:1}).scaleT};
      pinchDist0=getPinchDist(e);
      if(e.touches&&e.touches.length>=2){
        const r=cv.getBoundingClientRect();
        pinchDx0=Math.abs(e.touches[0].clientX-e.touches[1].clientX);
        pinchDy0=Math.abs(e.touches[0].clientY-e.touches[1].clientY);
      }
      renderAll(); return;
    }

    // DRAW TOOLS
    const t=xToTime(pos.x,sc), p=yToPrice(pos.y,sc);
    if(TOOL==='channel'&&DRAW&&DRAW.type==='channel'&&DRAW.phase===1){
      DRAW.phase=2; DRAW.p3Price=p; DRAW.p3Time=t;
    } else {
      DRAW={type:TOOL,tfId:tf.id,color:COLOR,style:STYLE,
        p1Time:t,p1Price:p,p2Time:t,p2Price:p,phase:TOOL==='channel'?1:undefined};
    }
    renderAll();
  }

  function onMove(e){
    e.preventDefault();
    const sc=getScale(tf.id); if(!sc) return;

    // Pinch zoom
    if(e.touches&&e.touches.length>=2){
      const dist=getPinchDist(e);
      if(pinchDist0&&dist){
        const ratio=dist/pinchDist0;
        const dx=Math.abs(e.touches[0].clientX-e.touches[1].clientX);
        const dy=Math.abs(e.touches[0].clientY-e.touches[1].clientY);
        const v=VIEW[tf.id]||{offsetT:0,scaleT:1,offsetP:0,scaleP:1};
        // Determine dominant direction from initial pinch
        if((pinchDx0||0) >= (pinchDy0||0)){
          // Horizontal pinch → time zoom
          v.scaleT=Math.max(0.3,Math.min(20,v.scaleT*ratio));
        } else {
          // Vertical pinch → price zoom
          v.scaleP=Math.max(0.3,Math.min(20,(v.scaleP||1)*ratio));
        }
        pinchDist0=dist;
        VIEW[tf.id]=v;
        renderAll();
      }
      return;
    }

    const pos=getPos(e);

    // Move selected line (or endpoint)
    if(movingLine&&moveStart){
      const curT=xToTime(pos.x,sc), curP=yToPrice(pos.y,sc);
      const dT=curT-moveStart.t, dP=curP-moveStart.p;
      const idx=LINES.findIndex(l=>l.id===movingLine.id);
      if(idx>=0){
        const l=LINES[idx];
        const ep=movingLine._ep;
        if(ep){
          // Endpoint drag: only move one end
        if(ep==='ch_p1'||ep==='ch_p2'){
          // Channel width adjustment
          l.p3Price=movingLine.p3Price+dP;
        } else if(ep==='p1'){ l.p1Time=movingLine.p1Time+dT; l.p1Price=movingLine.p1Price+dP; }
        else          { l.p2Time=movingLine.p2Time+dT; l.p2Price=movingLine.p2Price+dP; }
        } else if(l.type==='hline'){
          l.p1Price=movingLine.p1Price+dP;
        } else {
          l.p1Time=movingLine.p1Time+dT; l.p1Price=movingLine.p1Price+dP;
          l.p2Time=movingLine.p2Time+dT; l.p2Price=movingLine.p2Price+dP;
          if(l.type==='channel'&&l.phase===2) l.p3Price=movingLine.p3Price+dP;
        }
      }
      renderAll(); return;
    }

    // Pan (horizontal=time, vertical=price)
    if(panStart&&TOOL==='pan'){
      const curT=xToTime(pos.x,sc);
      const curP=yToPrice(pos.y,sc);
      const dT=panStart.t-curT;
      const dP=panStart.p-curP;
      const v=VIEW[tf.id]||{offsetT:0,scaleT:1,offsetP:0,scaleP:1};
      v.offsetT+=dT;
      v.offsetP+=dP;
      VIEW[tf.id]=v;
      renderAll(); return;
    }

    // Drawing
    if(!DRAW) return;
    const t=xToTime(pos.x,sc), p=yToPrice(pos.y,sc);
    if(DRAW.type==='channel'&&DRAW.phase===2){ DRAW.p3Price=p; }
    else{ DRAW.p2Time=t; DRAW.p2Price=p; }
    renderAll();
  }

  function onEnd(e){
    e.preventDefault();
    pinchDist0=null;

    // Finish line move
    if(movingLine){
      pushUndo();
      // lines already mutated in onMove, just save
      // restore original then apply final delta
      const pos=getPos(e.changedTouches?{touches:e.changedTouches}:e);
      saveLines();
      movingLine=null; moveStart=null;
      renderAll(); return;
    }
    panStart=null;

    if(!DRAW) return;
    if(DRAW.type==='channel'&&(DRAW.phase===1)) return; // wait for phase2 tap
    if(DRAW.type==='channel'&&DRAW.phase===2){
      pushUndo();
      LINES.push({...DRAW,id:Date.now()});
      saveLines(); DRAW=null; renderAll(); return;
    }
    // line/hline: require minimum drag
    const sc=getScale(tf.id);
    if(sc&&DRAW.type!=='hline'){
      const dx=timeToX(DRAW.p2Time,sc)-timeToX(DRAW.p1Time,sc);
      const dy=priceToY(DRAW.p2Price,sc)-priceToY(DRAW.p1Price,sc);
      if(Math.hypot(dx,dy)<8){ DRAW=null; renderAll(); return; }
    }
    pushUndo();
    LINES.push({...DRAW,id:Date.now()});
    saveLines(); DRAW=null; renderAll();
  }

  cv.addEventListener('touchstart',onStart,{passive:false});
  cv.addEventListener('touchmove', onMove, {passive:false});
  cv.addEventListener('touchend',  onEnd,  {passive:false});
  cv.addEventListener('mousedown', onStart);
  cv.addEventListener('mousemove', e=>{ if(e.buttons) onMove(e); });
  cv.addEventListener('mouseup',   onEnd);
});

const PAL_KEY='n225_palette';
const PAL_DEFAULTS=['#ffffff','#ff3d5a','#00c4ff','#f5c842','#44ff88'];
let PALETTE=[];
let PAL_ACTIVE=0;
let _palEditIdx=null;

function loadPalette(){
  try{ PALETTE=JSON.parse(localStorage.getItem(PAL_KEY)||'null')||[...PAL_DEFAULTS]; }
  catch{ PALETTE=[...PAL_DEFAULTS]; }
  renderPalette();
  COLOR=PALETTE[0];
}
function savePalette(){ try{ localStorage.setItem(PAL_KEY,JSON.stringify(PALETTE)); }catch{} }
function renderPalette(){
  PALETTE.forEach((c,i)=>{
    const el=document.getElementById('pal'+i);
    if(el){ el.style.background=c; el.className='pal-slot'+(i===PAL_ACTIVE?' active':''); }
  });
}
function palClick(i){
  PAL_ACTIVE=i; COLOR=PALETTE[i]; renderPalette();
  // Change selected line color
  if(SELECTED){
    pushUndo();
    const l=LINES.find(l=>l.id===SELECTED);
    if(l){ l.color=COLOR; saveLines(); renderAll(); }
  }
}
function palEdit(i){
  _palEditIdx=i;
  const picker=document.getElementById('palPicker');
  picker.value=PALETTE[i];
  picker.oninput=picker.onchange=function(){
    PALETTE[_palEditIdx]=this.value;
    savePalette(); renderPalette();
    if(_palEditIdx===PAL_ACTIVE){ COLOR=this.value; }
  };
  picker.click();
}

// Attach palette events after DOM ready
function attachPaletteEvents(){
  for(let i=0;i<5;i++){
    const el=document.getElementById('pal'+i);
    if(!el) continue;
    // Long press to edit
    let lt=null;
    el.addEventListener('touchstart', e=>{
      lt=setTimeout(()=>{ lt=null; palEdit(i); },500);
    },{passive:true});
    el.addEventListener('touchend', ()=>{ if(lt){clearTimeout(lt);lt=null;palClick(i);} },{passive:true});
    el.addEventListener('touchmove', ()=>{ if(lt){clearTimeout(lt);lt=null;} },{passive:true});
    el.addEventListener('click', ()=>palClick(i));
    el.addEventListener('contextmenu', e=>{ e.preventDefault(); palEdit(i); });
  }
}

const SETTINGS_KEY='n225_settings';
let SETTINGS={
  toolbarBg:'#141414',
  palCount:5,
  chartOrder:['1h','15m','5m'],
  chartHeights:{1h:198,15m:186,'5m':186},
  candleCount:{1h:0,15m:0,'5m':0}, // 0 = auto
};

function loadSettings(){

  applyToolbarBg(SETTINGS.toolbarBg||'#141414');
}
function saveSettings(){ try{ localStorage.setItem(SETTINGS_KEY,JSON.stringify(SETTINGS)); }catch{} }

function applyToolbarBg(c){
  SETTINGS.toolbarBg=c;
  document.getElementById('toolbar').style.background=c;
  document.getElementById('toolbar').style.backdropFilter='none';
  saveSettings();
}

function openSettings(){
  renderSettingsPanel();

  document.getElementById('settingsPanel').style.display='block';

}

function setPalCount(n){
  SETTINGS.palCount=n;
  // Ensure palette has enough entries
  while(PALETTE.length<n) PALETTE.push('#ffffff');

  renderPalette(); renderSettingsPanel();
}

function renderSettingsPanel(){
  // Toolbar bg
  const tbBgEl=document.getElementById('cfgToolbarBg');
  if(tbBgEl) tbBgEl.value=SETTINGS.toolbarBg||'#141414';

  // Palette count buttons
  const cntEl=document.querySelector('#settingsPanel .cfg-pal-cnt')?.parentElement;
  if(cntEl){
    cntEl.querySelectorAll('.cfg-pal-cnt').forEach(b=>{
      b.classList.toggle('active', parseInt(b.dataset.n)===SETTINGS.palCount);
    });
  }

  // Palette color list
  const palList=document.getElementById('cfgPalList');
  if(palList){
    palList.innerHTML='';
    for(let i=0;i<SETTINGS.palCount;i++){
      const row=document.createElement('div');
      row.className='cfg-row';
      row.innerHTML=`<div style="width:28px;height:28px;border-radius:50%;background:${PALETTE[i]||'#fff'};border:1px solid #555;flex-shrink:0"></div>`
        +`<div class="cfg-label">色 ${i+1}</div>`
        +`<input type="color" value="${PALETTE[i]||'#ffffff'}" data-idx="${i}"
            style="width:36px;height:28px;border:none;border-radius:4px;cursor:pointer;padding:1px;"
            onchange="palColorChange(${i},this.value)">`;
      palList.appendChild(row);
    }
  }

  // Chart order (drag to reorder)
  const orderEl=document.getElementById('cfgChartOrder');
  if(orderEl){
    orderEl.innerHTML='';
    SETTINGS.chartOrder.forEach((id,i)=>{
      const tf=TFS.find(t=>t.id===id);
      if(!tf) return;
      const row=document.createElement('div');
      row.className='cfg-row';
      row.draggable=true;
      row.dataset.idx=i;
      row.innerHTML=`<div class="cfg-drag">☰</div><div class="cfg-label">${tf.label}</div>`;
      row.addEventListener('dragstart',e=>{ e.dataTransfer.setData('text/plain',i); });
      row.addEventListener('dragover',e=>e.preventDefault());
      row.addEventListener('drop',e=>{
        e.preventDefault();
        const from=parseInt(e.dataTransfer.getData('text/plain'));
        const to=i;
        if(from===to) return;
        const arr=[...SETTINGS.chartOrder];
        const [m]=arr.splice(from,1); arr.splice(to,0,m);
        SETTINGS.chartOrder=arr;
        saveSettings(); applyChartOrder(); renderSettingsPanel();
      });
      orderEl.appendChild(row);
    });
  }

  // Chart heights
  const hEl=document.getElementById('cfgChartHeights');
  if(hEl){
    hEl.innerHTML='';
    SETTINGS.chartOrder.forEach(id=>{
      const tf=TFS.find(t=>t.id===id);
      if(!tf) return;
      const h=SETTINGS.chartHeights[id]||tf.h;
      const row=document.createElement('div');
      row.className='cfg-row';
      row.innerHTML=`<div class="cfg-label">${tf.label}</div>`
        +`<input type="range" class="cfg-range" min="80" max="400" value="${h}" data-id="${id}"
            oninput="this.nextElementSibling.textContent=this.value+'px';setChartHeight('${id}',parseInt(this.value))">`
        +`<div style="font-size:11px;color:#888;width:36px">${h}px</div>`;
      hEl.appendChild(row);
    });
  }

  // Candle count
  const ccEl=document.getElementById('cfgCandleCount');
  if(ccEl){
    ccEl.innerHTML='';
    SETTINGS.chartOrder.forEach(id=>{
      const tf=TFS.find(t=>t.id===id);
      if(!tf) return;
      const cnt=SETTINGS.candleCount?.[id]||0;
      const row=document.createElement('div');
      row.className='cfg-row';
      row.innerHTML=`<div class="cfg-label">${tf.label}</div>`
        +`<input type="range" class="cfg-range" min="0" max="300" step="10" value="${cnt}" data-id="${id}"
            oninput="this.nextElementSibling.textContent=this.value==0?'自動':this.value+'本';setCandleCount('${id}',parseInt(this.value))">`
        +`<div style="font-size:11px;color:#888;width:36px">${cnt===0?'自動':cnt+'本'}</div>`;
      ccEl.appendChild(row);
    });
  }
}

function findEndpointHit(line,x,y,sc,thresh=18){
  if(line.type==='hline') return null;
  const x1=timeToX(line.p1Time,sc), y1=priceToY(line.p1Price,sc);
  const x2=timeToX(line.p2Time,sc), y2=priceToY(line.p2Price,sc);
  if(Math.hypot(x-x1,y-y1)<thresh) return 'p1';
  if(Math.hypot(x-x2,y-y2)<thresh) return 'p2';
  // Channel parallel line endpoints for width adjustment
  if(line.type==='channel' && line.phase===2){
    const offPx=(line.p3Price-line.p1Price)*sc.ch/sc.vr;
    if(Math.hypot(x-x1, y-(y1-offPx))<thresh) return 'ch_p1';
    if(Math.hypot(x-x2, y-(y2-offPx))<thresh) return 'ch_p2';
  }
  return null;
}
