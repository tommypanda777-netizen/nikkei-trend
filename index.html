
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="市場動向">
<link rel="apple-touch-icon" href="icon.jpg">
<title>市場動向</title>
<style>
:root {
  --bg: #0a0a0a;
  --surface: #161616;
  --border: #2a2a2a;
  --bull: #ff3d5a;
  --bear: #00c4ff;
  --neutral: #555;
  --gold: #f5c842;
  --text: #e8eef5;
  --dim: #666;
  --mono: 'Share Tech Mono', monospace;
}
* { margin:0; padding:0; box-sizing:border-box; }
body { background:var(--bg); color:var(--text); font-family:'Noto Sans JP', sans-serif; min-height:100vh; }

.wrap { max-width:100%; padding:12px; }

/* HEADER */
header {
  display:flex; align-items:center; justify-content:space-between;
  padding:10px 0 12px; border-bottom:1px solid var(--border); margin-bottom:12px;
}
.hdr-left { display:flex; flex-direction:column; gap:2px; }
.hdr-title { font-family:var(--mono); font-size:11px; color:var(--dim); letter-spacing:3px; }
.hdr-price { font-family:var(--mono); font-size:28px; font-weight:bold; line-height:1; }
.hdr-change { font-family:var(--mono); font-size:12px; margin-top:2px; }
.hdr-right { display:flex; flex-direction:column; align-items:flex-end; gap:6px; }
.upd-row { display:flex; gap:6px; align-items:center; }
.upd-time { font-family:var(--mono); font-size:10px; color:var(--dim); }
.btn { background:var(--surface); border:1px solid var(--border); color:var(--dim);
  padding:4px 10px; border-radius:4px; font-family:var(--mono); font-size:11px; cursor:pointer; }
.btn:active { opacity:.7; }
select.btn { text-align:center; text-align-last:center; color-scheme:dark; }

/* SECTION LABEL */
.sec-lbl {
  font-family:var(--mono); font-size:9px; color:var(--dim);
  letter-spacing:3px; margin:14px 0 6px;
}

/* SIGNAL CARD */
.card {
  display:flex; align-items:center;
  background:var(--surface); border:1px solid var(--border);
  border-radius:6px; padding:12px 14px; margin-bottom:8px;
  gap:12px;
}
.card-body { flex:1; min-width:0; }
.card-name { font-size:11px; color:var(--dim); font-family:var(--mono); margin-bottom:3px; }
.card-val { font-size:15px; font-weight:bold; }
.card-sub { font-size:10px; color:var(--dim); font-family:var(--mono); margin-top:2px; }
.badge {
  flex-shrink:0; width:56px; height:44px;
  border-radius:5px; display:flex; align-items:center; justify-content:center;
  font-size:13px; font-weight:bold; font-family:var(--mono);
  letter-spacing:1px;
}
.badge.bull { background:rgba(255,61,90,.25); color:var(--bull); border:1px solid rgba(255,61,90,.4); }
.badge.bear { background:rgba(0,196,255,.2); color:var(--bear); border:1px solid rgba(0,196,255,.3); }
.badge.neutral { background:rgba(85,85,85,.3); color:#999; border:1px solid var(--border); }

/* LOADING / ERROR */
.loading { text-align:center; padding:40px; font-family:var(--mono); font-size:12px; color:var(--dim); letter-spacing:2px; }
.err { background:rgba(255,61,90,.1); border:1px solid rgba(255,61,90,.3); border-radius:6px;
  padding:14px; font-family:var(--mono); font-size:11px; color:var(--bull); text-align:center; }

footer { text-align:center; padding:16px 0 8px; font-family:var(--mono); font-size:9px;
  color:var(--dim); letter-spacing:2px; border-top:1px solid var(--border); margin-top:8px; }
</style>
<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Noto+Sans+JP:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>
<div class="wrap">
  <header>
    <div class="hdr-left">
      <div class="hdr-title">N225 FUTURES SIGNAL</div>
      <div class="hdr-price" id="hdrPrice">---</div>
      <div class="hdr-change" id="hdrChange">---</div>
    </div>
    <div class="hdr-right">
      <div class="upd-row">
        <span class="upd-time" id="updTime">---</span>
        <button class="btn" onclick="loadAll()">↻</button>
      </div>
      <select class="btn" id="autoSel" onchange="setAuto(this.value)">
        <option value="0">手動</option>
        <option value="60">1分</option>
        <option value="180">3分</option>
        <option value="300">5分</option>
      </select>
    </div>
  </header>

  <div id="app"><div class="loading">データ取得中...</div></div>

  <footer>MARKET SIGNAL DASHBOARD<br>
    <span style="font-size:8px;opacity:.5">※投資判断は自己責任で</span>
  </footer>
</div>

<script>
// ===== FETCH =====
async function fetchYahoo(sym, interval, range) {
  const url = 'https://query1.finance.yahoo.com/v8/finance/chart/'
    + encodeURIComponent(sym)
    + '?interval=' + interval + '&range=' + range + '&includePrePost=false';
  const ctrl = new AbortController();
  const t = setTimeout(() => ctrl.abort(), 8000);
  try {
    const r = await fetch('https://corsproxy.io/?' + encodeURIComponent(url), { signal: ctrl.signal });
    clearTimeout(t);
    if (!r.ok) return null;
    const j = await r.json();
    const q = j?.chart?.result?.[0]?.indicators?.quote?.[0];
    if (!q) return null;
    const closes = (q.close||[]).filter(v => v != null && !isNaN(v));
    if (closes.length < 2) return null;
    const highs = (q.high||[]).filter(v => v != null && !isNaN(v));
    const lows  = (q.low ||[]).filter(v => v != null && !isNaN(v));
    return {
      closes,
      highs: highs.length === closes.length ? highs : closes.map(c=>c*1.002),
      lows:  lows.length  === closes.length ? lows  : closes.map(c=>c*0.998),
    };
  } catch { clearTimeout(t); return null; }
}

// ===== MATH =====
function sma(arr, n) {
  if (!arr || arr.length < n) return null;
  return arr.slice(-n).reduce((a,b)=>a+b,0)/n;
}
function ema(arr, n) {
  if (!arr || arr.length < n) return null;
  const k = 2/(n+1);
  let e = arr[0];
  for (let i=1;i<arr.length;i++) e = arr[i]*k + e*(1-k);
  return e;
}
function rsi(arr, n=14) {
  if (!arr || arr.length < n+1) return null;
  const recent = arr.slice(-(n+1));
  let gains=0, losses=0;
  for (let i=1;i<recent.length;i++) {
    const d = recent[i]-recent[i-1];
    if (d>0) gains+=d; else losses-=d;
  }
  const ag=gains/n, al=losses/n;
  return al===0 ? 100 : 100 - 100/(1+ag/al);
}
function atr(tf, n=14) {
  if (!tf) return 0;
  const trs=[];
  for (let i=1;i<tf.closes.length;i++) {
    trs.push(Math.max(
      tf.highs[i]-tf.lows[i],
      Math.abs(tf.highs[i]-tf.closes[i-1]),
      Math.abs(tf.lows[i]-tf.closes[i-1])
    ));
  }
  if (!trs.length) return 0;
  return trs.slice(-n).reduce((a,b)=>a+b,0)/Math.min(n,trs.length);
}

// TFトレンド判定（MA＋MACD）
function tfSignal(tf) {
  if (!tf || tf.closes.length < 10) return { signal:'neutral', label:'中立', sub:'データ不足' };
  const c = tf.closes;
  const n = c.length;
  const s5  = sma(c, Math.min(5,n));
  const s20 = sma(c, Math.min(20,n));
  const e12 = ema(c.slice(-26), 12);
  const e26 = ema(c.slice(-26), 26);
  const macd = (e12 && e26) ? e12-e26 : 0;
  const cur = c[n-1];
  const bull = cur > s5 && s5 > s20 && macd > 0;
  const bear = cur < s5 && s5 < s20 && macd < 0;

  // トレンドライン判定（最後の5本の方向）
  const slope5 = c.length >= 5 ? (c[n-1]-c[n-5])/5 : 0;
  const trendUp = slope5 > 0;

  if (bull) return { signal:'bull', label:'上昇', sub:'MA↑ MACD↑' };
  if (bear) return { signal:'bear', label:'下降', sub:'MA↓ MACD↓' };
  return { signal:'neutral', label:'中立', sub: trendUp ? '方向感弱・やや上' : '方向感弱・やや下' };
}

// ===== CARD HTML =====
function card(name, valStr, sub, signal) {
  const cls = signal === 'bull' ? 'bull' : signal === 'bear' ? 'bear' : 'neutral';
  const lbl = signal === 'bull' ? '買い' : signal === 'bear' ? '売り' : '中立';
  return '<div class="card">'
    + '<div class="card-body">'
    + '<div class="card-name">' + name + '</div>'
    + '<div class="card-val">' + valStr + '</div>'
    + (sub ? '<div class="card-sub">' + sub + '</div>' : '')
    + '</div>'
    + '<div class="badge ' + cls + '">' + lbl + '</div>'
    + '</div>';
}

function fmt(v) { return Math.round(v).toLocaleString(); }
function pct(v) { return (v>0?'+':'')+v.toFixed(2)+'%'; }

// ===== MAIN =====
async function loadAll() {
  const app = document.getElementById('app');
  app.innerHTML = '<div class="loading">データ取得中...</div>';

  try {
    // データ取得（日足は必須）
    const d1 = await fetchYahoo('NKD=F', '1d', '3mo');
    if (!d1) throw new Error('日足データを取得できませんでした');

    const [h1, m15, m5, vixD, usdD, tnxD, irxD] = await Promise.allSettled([
      fetchYahoo('NKD=F', '1h', '5d'),
      fetchYahoo('NKD=F', '15m', '2d'),
      fetchYahoo('NKD=F', '5m',  '1d'),
      fetchYahoo('^VIX',  '1d',  '5d'),
      fetchYahoo('USDJPY=X','1d','5d'),
      fetchYahoo('^TNX',  '1d',  '1mo'),  // 米10年金利
      fetchYahoo('^IRX',  '1d',  '1mo'),  // 米3ヶ月金利
    ]);

    const tf1h  = h1.value;
    const tf15m = m15.value || tf1h || d1;
    const tf5m  = m5.value  || tf15m;
    const vix   = vixD.value?.closes.at(-1)  || null;
    const usd   = usdD.value?.closes.at(-1)  || null;
    const tnx   = tnxD.value?.closes.at(-1)  || null;
    const irx   = irxD.value?.closes.at(-1)  || null;

    // 現在値・前日比
    const cur    = d1.closes.at(-1);
    const prev   = d1.closes.at(-2);
    const chg    = cur - prev;
    const chgPct = chg / prev * 100;

    // ヘッダー更新
    document.getElementById('hdrPrice').textContent = fmt(cur);
    document.getElementById('hdrPrice').style.color = chg >= 0 ? 'var(--bull)' : 'var(--bear)';
    document.getElementById('hdrChange').textContent = (chg>=0?'+':'')+fmt(chg)+' ('+pct(chgPct)+') 前日比';
    document.getElementById('hdrChange').style.color = chg >= 0 ? 'var(--bull)' : 'var(--bear)';
    const now = new Date();
    document.getElementById('updTime').textContent = '更新: '+now.getHours()+':'+String(now.getMinutes()).padStart(2,'0');

    // ===== シグナル計算 =====

    // TFシグナル
    const sig5m  = tfSignal(tf5m);
    const sig15m = tfSignal(tf15m);
    const sig1h  = tfSignal(tf1h);
    const sig1d  = tfSignal(d1);

    // 週足（日足5本まとめ）
    const wkCloses = [], wkHighs = [], wkLows = [];
    for (let i=0; i+4<d1.closes.length; i+=5) {
      wkCloses.push(d1.closes[i+4]);
      wkHighs.push(Math.max(...d1.highs.slice(i,i+5)));
      wkLows.push(Math.min(...d1.lows.slice(i,i+5)));
    }
    const tf1w = wkCloses.length >= 4 ? {closes:wkCloses, highs:wkHighs, lows:wkLows} : null;
    const sig1w = tfSignal(tf1w);

    // 月足（日足20本まとめ）
    const moCloses = [], moHighs = [], moLows = [];
    for (let i=0; i+19<d1.closes.length; i+=20) {
      moCloses.push(d1.closes[i+19]);
      moHighs.push(Math.max(...d1.highs.slice(i,i+20)));
      moLows.push(Math.min(...d1.lows.slice(i,i+20)));
    }
    const tf1m = moCloses.length >= 2 ? {closes:moCloses, highs:moHighs, lows:moLows} : null;
    const sig1m = tfSignal(tf1m);

    // MA乖離率（25日MA）
    const ma25 = sma(d1.closes, 25);
    const devPct = ma25 ? (cur - ma25) / ma25 * 100 : null;
    let devSig = 'neutral', devSub = '正常範囲';
    if (devPct !== null) {
      if (devPct > 7)       { devSig='bear'; devSub='上方過熱 ⚠ 追い買い注意'; }
      else if (devPct > 4)  { devSig='neutral'; devSub='やや上方乖離 注意'; }
      else if (devPct < -7) { devSig='bull'; devSub='下方過熱 ⚠ 追い売り注意'; }
      else if (devPct < -4) { devSig='neutral'; devSub='やや下方乖離 注意'; }
      else                  { devSig='neutral'; devSub='MA付近 正常範囲'; }
    }

    // RSI（14日）
    const rsiVal = rsi(d1.closes, 14);
    let rsiSig = 'neutral', rsiSub = '中立ゾーン';
    if (rsiVal !== null) {
      if (rsiVal >= 75)      { rsiSig='bear'; rsiSub='買われすぎ ⚠ 反転注意'; }
      else if (rsiVal >= 60) { rsiSig='bull'; rsiSub='強気ゾーン'; }
      else if (rsiVal <= 25) { rsiSig='bull'; rsiSub='売られすぎ ⚠ 反転注意'; }
      else if (rsiVal <= 40) { rsiSig='bear'; rsiSub='弱気ゾーン'; }
    }

    // VIX
    let vixSig = 'neutral', vixSub = '---';
    if (vix) {
      if (vix >= 30)       { vixSig='bear'; vixSub='恐怖 — 急落リスク高'; }
      else if (vix >= 20)  { vixSig='neutral'; vixSub='警戒ゾーン'; }
      else if (vix <= 14)  { vixSig='bull'; vixSub='落ち着き — リスクオン'; }
      else                 { vixSig='neutral'; vixSub='平常範囲'; }
    }

    // 長期金利（米10年）
    let tnxSig = 'neutral', tnxSub = '---';
    if (tnx && tnxD.value?.closes.length >= 5) {
      const tnxPrev = tnxD.value.closes.at(-5);
      const tnxDir  = tnx - tnxPrev;
      if (tnx >= 4.5 && tnxDir > 0)       { tnxSig='bear'; tnxSub='高水準・上昇 — 株に逆風'; }
      else if (tnx >= 4.5)                 { tnxSig='neutral'; tnxSub='高水準だが横ばい'; }
      else if (tnxDir > 0.1)               { tnxSig='neutral'; tnxSub='上昇中 — 要注意'; }
      else if (tnxDir < -0.1)              { tnxSig='bull'; tnxSub='低下中 — 株に追い風'; }
      else                                 { tnxSig='neutral'; tnxSub='横ばい'; }
    }

    // ドル円
    let usdSig = 'neutral', usdSub = '---';
    if (usd && usdD.value?.closes.length >= 5) {
      const usdPrev = usdD.value.closes.at(-5);
      const usdDir  = usd - usdPrev;
      if (usdDir > 1)        { usdSig='bull'; usdSub='円安進行 — 先物に追い風'; }
      else if (usdDir < -1)  { usdSig='bear'; usdSub='円高進行 — 先物に逆風'; }
      else                   { usdSig='neutral'; usdSub='横ばい'; }
    }

    // ===== RENDER =====
    let html = '';

    html += '<div class="sec-lbl">テクニカル — タイムフレーム別</div>';
    html += card('5分足',  sig5m.label,  sig5m.sub,  sig5m.signal);
    html += card('15分足', sig15m.label, sig15m.sub, sig15m.signal);
    html += card('1時間足', sig1h.label,  sig1h.sub,  sig1h.signal);
    html += card('日足 (1D)', sig1d.label, sig1d.sub, sig1d.signal);
    html += card('週足 (1W)', sig1w.label, sig1w.sub, sig1w.signal);
    html += card('月足 (1M)', sig1m.label, sig1m.sub, sig1m.signal);

    html += '<div class="sec-lbl">テクニカル指標</div>';
    html += card('MA乖離率 (25日MA)',
      devPct !== null ? pct(devPct) : '---',
      devSub, devSig);
    html += card('RSI (14日)',
      rsiVal !== null ? rsiVal.toFixed(1) : '---',
      rsiSub, rsiSig);

    html += '<div class="sec-lbl">マクロ指標</div>';
    html += card('VIX 恐怖指数',
      vix ? vix.toFixed(2) : '---',
      vixSub, vixSig);
    html += card('米10年金利',
      tnx ? tnx.toFixed(2)+'%' : '---',
      tnxSub, tnxSig);
    html += card('ドル円',
      usd ? usd.toFixed(2) : '---',
      usdSub, usdSig);

    app.innerHTML = html;

  } catch(e) {
    document.getElementById('app').innerHTML =
      '<div class="err">⚠ ' + e.message + '<br><br>'
      + '<span style="font-size:10px;opacity:.6">↻ボタンで再試行</span></div>';
  }
}

// 自動更新
let _autoTimer = null;
function setAuto(sec) {
  if (_autoTimer) { clearInterval(_autoTimer); _autoTimer=null; }
  localStorage.setItem('auto_refresh', sec);
  if (parseInt(sec) > 0) _autoTimer = setInterval(loadAll, parseInt(sec)*1000);
}
const _saved = localStorage.getItem('auto_refresh') || '0';
document.getElementById('autoSel').value = _saved;
if (parseInt(_saved) > 0) _autoTimer = setInterval(loadAll, parseInt(_saved)*1000);

loadAll();
</script>
</body>
</html>
