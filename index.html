
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="チャート作図">
<link rel="apple-touch-icon" href="icon.jpg">
<title>チャート作図</title>
<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
:root{
  --bg:#0a0a0a;--surface:#181818;--border:#333;
  --text:#e8e8e8;--dim:#aab2bd;--gold:#f5c842;
  --bull:#ff3d5a;--bear:#00c4ff;--mono:'Share Tech Mono',monospace;
}
body{background:var(--bg);color:var(--text);font-family:var(--mono);overflow:hidden;height:100vh;display:flex;flex-direction:column;}

/* TOOLBAR */
#toolbar{flex-shrink:0;background:#1e1e1e;border-bottom:1px solid var(--border);padding:6px 8px;display:flex;flex-direction:column;gap:5px;}
.tb-row{display:flex;align-items:center;gap:5px;}
.tb-btn{height:32px;padding:0 10px;border-radius:4px;border:1px solid var(--border);background:var(--surface);color:#d5dae0;font-family:var(--mono);font-size:13px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:3px;white-space:nowrap;}
.tb-btn.active{border-color:var(--gold);color:var(--gold);background:rgba(245,200,66,.1);}
.tb-btn.del-mode{border-color:var(--bull);color:var(--bull);background:rgba(255,61,90,.1);}
.tb-btn.disabled{opacity:.3;pointer-events:none;}
.tb-sel{height:32px;padding:0 8px;border-radius:4px;border:1px solid var(--border);background:var(--surface);color:var(--text);font-family:var(--mono);font-size:12px;cursor:pointer;color-scheme:dark;}
.tb-sep{width:1px;height:22px;background:var(--border);flex-shrink:0;}
.pal{width:22px;height:22px;border-radius:50%;cursor:pointer;border:2px solid transparent;flex-shrink:0;}
.pal.active{border-color:#fff;}
.sty{height:26px;padding:0 8px;border-radius:3px;border:1px solid var(--border);background:var(--surface);color:var(--dim);font-family:var(--mono);font-size:11px;cursor:pointer;}
.sty.active{border-color:var(--gold);color:var(--gold);}

/* CHARTS */
#charts{flex:1;overflow-y:auto;overflow-x:hidden;}
.chart-wrap{position:relative;border-bottom:2px solid #3a3a3a;overflow:hidden;}
.chart-label{position:absolute;top:5px;left:8px;font-size:10px;color:#aaa;background:rgba(0,0,0,.7);padding:2px 6px;border-radius:2px;z-index:5;display:flex;align-items:center;gap:4px;}
.lock-btn{background:none;border:none;cursor:pointer;padding:2px;opacity:.5;line-height:1;pointer-events:all;}
.lock-btn.locked{opacity:1;}
.lock-btn.locked svg{stroke:var(--gold);}
.price-tag{position:absolute;right:0;font-size:10px;font-family:var(--mono);background:var(--gold);color:#000;padding:1px 4px;border-radius:2px 0 0 2px;pointer-events:none;z-index:5;transform:translateY(-50%);font-weight:bold;}
canvas{display:block;width:100%;touch-action:none;}

/* TOAST */
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:rgba(245,200,66,.15);border:1px solid var(--gold);color:var(--gold);font-family:var(--mono);font-size:12px;padding:7px 16px;border-radius:20px;z-index:999;opacity:0;transition:opacity .3s;pointer-events:none;white-space:nowrap;}
#toast.show{opacity:1;}

/* SETTINGS */
#settingsOverlay{display:none;position:fixed;inset:0;z-index:200;background:rgba(0,0,0,.6);}
#settingsPanel{display:none;position:fixed;top:0;right:0;bottom:0;z-index:201;width:min(300px,88vw);background:#1a1a1a;border-left:1px solid var(--border);overflow-y:auto;padding:14px;}
.cfg-title{font-size:10px;letter-spacing:3px;color:var(--dim);margin-bottom:12px;display:flex;justify-content:space-between;align-items:center;}
.cfg-sec{font-size:10px;color:var(--dim);letter-spacing:2px;margin:14px 0 7px;border-top:1px solid var(--border);padding-top:10px;}
.cfg-row{display:flex;align-items:center;gap:8px;padding:7px 10px;background:#222;border:1px solid var(--border);border-radius:5px;margin-bottom:5px;}
.cfg-label{font-size:12px;color:#ccc;flex:1;}
.cfg-range{flex:1;accent-color:var(--gold);}
.cfg-val{font-size:11px;color:var(--dim);width:40px;text-align:right;}
.cfg-close{background:none;border:none;color:var(--dim);font-size:18px;cursor:pointer;}
.cfg-cnt-btn{height:28px;min-width:30px;padding:0 6px;border-radius:3px;border:1px solid var(--border);background:#222;color:var(--dim);font-family:var(--mono);font-size:12px;cursor:pointer;}
.cfg-cnt-btn.active{border-color:var(--gold);color:var(--gold);}
</style>
</head>
<body>

<div id="toolbar">
  <!-- Row 1 -->
  <div class="tb-row">
    <select class="tb-sel" id="symSel" onchange="setSym(this.value)" style="width:86px"></select>
    <div class="tb-sep"></div>
    <button class="tb-btn active" id="toolPan" onclick="setTool('pan',this)">
      <svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"><path d="M7 1v12M1 7h12M7 1l-2 2.5M7 1l2 2.5M7 13l-2-2.5M7 13l2-2.5M1 7l2.5-2M1 7l2.5 2M13 7l-2.5-2M13 7l-2.5 2"/></svg>
    </button>
    <button class="tb-btn" id="toolLine" onclick="setTool('line',this)" style="font-size:15px">╱</button>
    <button class="tb-btn" id="toolHline" onclick="setTool('hline',this)" style="font-size:15px">―</button>
    <button class="tb-btn" id="toolChannel" onclick="setTool('channel',this)" style="font-size:15px">⫛</button>
    <div class="tb-sep"></div>
    <button class="tb-btn" id="btnDel" onclick="toggleDel()">
      <svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"><path d="M1.5 3.5h11M4 3.5V2h6v1.5M5 6v5M9 6v5M2.5 3.5l1 8h7l1-8"/></svg>
    </button>
    <button class="tb-btn" onclick="openSettings()" style="margin-left:auto">
      <svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"><circle cx="7" cy="7" r="2"/><circle cx="7" cy="7" r="4.5"/><path d="M7 1v1.5M7 11.5V13M1 7h1.5M11.5 7H13M2.8 2.8l1 1M10.2 10.2l1 1M2.8 11.2l1-1M10.2 3.8l1-1"/></svg>
    </button>
  </div>
  <!-- Row 2 -->
  <div class="tb-row">
    <div id="palRow"></div>
    <input type="color" id="palPicker" style="width:0;height:0;opacity:0;position:absolute">
    <div class="tb-sep"></div>
    <button class="sty active" id="styS" onclick="setStyle('solid',this)">実線</button>
    <button class="sty" id="styD" onclick="setStyle('dash',this)">点線</button>
  </div>
  <!-- Row 3 -->
  <div class="tb-row">
    <select class="tb-sel" id="autoSel" onchange="setAuto(this.value)" style="width:72px"></select>
    <button class="tb-btn" onclick="loadAll()" style="font-size:16px">↻</button>
    <span id="updTime" style="font-size:15px;color:#ccc;min-width:46px">---</span>
    <span id="devRate" style="margin-left:14px;font-size:15px;color:#ccc;white-space:nowrap">25MA乖離率 <span id="devVal" style="font-size:18px">--</span></span>
    <button class="tb-btn disabled" id="btnUndo" onclick="undo()" style="margin-left:auto;font-size:16px">↩</button>
    <button class="tb-btn disabled" id="btnRedo" onclick="redo()" style="font-size:16px">↪</button>
  </div>
</div>

<div id="charts"></div>

<div id="toast"></div>
<div id="settingsOverlay" onclick="closeSettings()"></div>
<div id="settingsPanel">
  <div class="cfg-title">
    <span>SETTINGS</span>
    <button class="cfg-close" onclick="closeSettings()">✕</button>
  </div>
  <div class="cfg-sec">ツールバー背景色</div>
  <div class="cfg-row"><div class="cfg-label">背景色</div><input type="color" id="cfgTbBg" onchange="setTbBg(this.value)" style="width:34px;height:28px;border:none;border-radius:4px;cursor:pointer;padding:1px;"></div>
  <div class="cfg-sec">パレット色数</div>
  <div id="cfgPalCnt" class="cfg-row" style="flex-wrap:wrap;gap:4px;"></div>
  <div class="cfg-sec">パレット色カスタム</div>
  <div id="cfgPalColors"></div>
  <div class="cfg-sec">チャート表示順（ドラッグ）</div>
  <div id="cfgOrder"></div>
  <div class="cfg-sec">チャート縦幅</div>
  <div id="cfgHeights"></div>
  <div class="cfg-sec">ローソク足表示本数</div>
  <div id="cfgCandles"></div>
</div>

<script>
// ==================== CONFIG ====================
const SYMS = {
  'NKD=F': '225先物',
  '1570.T': '1570',
  '1579.T': '1579',
};
const TF_DEFS = {
  '5m':  {label:'5分足',  interval:'5m',  range:'5d'},
  '15m': {label:'15分足', interval:'15m', range:'1mo'},
  '1h':  {label:'60分足', interval:'1h',  range:'3mo'},
  '1d':  {label:'日足',   interval:'1d',  range:'1y'},
  '1wk': {label:'週足',   interval:'1wk', range:'5y'},
  '1mo': {label:'月足',   interval:'1mo', range:'10y'},
};
const PAD = {l:4, r:52, t:10, b:18};

// ==================== STATE ====================
let SYM    = 'NKD=F';
let TOOL   = 'pan';
let COLOR  = '#ffffff';
let STYLE  = 'solid';
let DATA   = {};
let LINES  = [];
let UNDO   = [], REDO = [];
let DEL_MODE = false;
let SELECTED = null;
let DRAW   = null; // in-progress line

// Per-chart view: {offsetT, scaleT, offsetP, scaleP}
const VIEW = {};
// Locked charts
const LOCKED = new Set();

// Settings
let CFG = {
  sym: 'NKD=F',
  auto: '0',
  tbBg: '#1e1e1e',
  palCount: 5,
  order: ['5m','15m','1h','1d','1wk','1mo'],
  visible: {'5m':true,'15m':true,'1h':true,'1d':false,'1wk':false,'1mo':false},
  heights: {'5m':200,'15m':200,'1h':200,'1d':200,'1wk':200,'1mo':200},
  candles: {'5m':0,'15m':0,'1h':0,'1d':0,'1wk':0,'1mo':0},
};
let PALETTE = ['#ffffff','#ff3d5a','#00c4ff','#f5c842','#44ff88','#ff8844','#cc88ff','#aaaaaa','#00ff00','#ff00ff'];
let PAL_ACTIVE = 0;

// ==================== STORAGE ====================
const SK = () => 'chart_lines_'+SYM;
function saveLines(){ try{localStorage.setItem(SK(),JSON.stringify(LINES));}catch{} }
function loadLines(){ try{LINES=JSON.parse(localStorage.getItem(SK())||'[]');}catch{LINES=[];} }
function saveCfg(){  try{localStorage.setItem('chart_cfg',JSON.stringify(CFG));}catch{} }
function loadCfg(){
  try{
    const c=JSON.parse(localStorage.getItem('chart_cfg')||'{}');
    Object.assign(CFG,c);
  }catch{}
  // Migration: ensure all known TFs exist in order/visible/heights/candles
  const allTFs=['5m','15m','1h','1d','1wk','1mo'];
  if(!CFG.visible) CFG.visible={};
  allTFs.forEach(id=>{
    if(!CFG.order.includes(id)) CFG.order.push(id);
    if(CFG.visible[id]===undefined) CFG.visible[id]=(id==='5m'||id==='15m'||id==='1h');
    if(CFG.heights[id]===undefined) CFG.heights[id]=200;
    if(CFG.candles[id]===undefined) CFG.candles[id]=0;
  });
}
function savePal(){  try{localStorage.setItem('chart_pal',JSON.stringify(PALETTE));}catch{} }
function loadPal(){  try{const p=JSON.parse(localStorage.getItem('chart_pal')||'null'); if(p)PALETTE=p;}catch{} }
const VK = () => 'chart_view_v6_'+SYM;
function saveView(){ try{localStorage.setItem(VK(),JSON.stringify(VIEW));}catch{} }
function loadView(){ try{const v=JSON.parse(localStorage.getItem(VK())||'null'); if(v){Object.keys(v).forEach(k=>{
  const o=v[k];
  // Sanity check: offsets must be reasonable index/price values, scales positive
  if(o && isFinite(o.offsetT) && Math.abs(o.offsetT)<1e10 && o.scaleT>0 && o.scaleT<100 && o.scaleP>0 && o.scaleP<100){
    VIEW[k]=o;
  }
});}}catch{} }
function saveLocks(){ try{localStorage.setItem('chart_locks',JSON.stringify([...LOCKED]));}catch{} }
function loadLocks(){ try{const a=JSON.parse(localStorage.getItem('chart_locks')||'[]'); LOCKED.clear(); a.forEach(id=>LOCKED.add(id));}catch{} }

// ==================== UNDO ====================
function pushUndo(){ UNDO.push(JSON.stringify(LINES)); REDO=[]; updateUndoBtns(); }
function undo(){ if(!UNDO.length)return; REDO.push(JSON.stringify(LINES)); LINES=JSON.parse(UNDO.pop()); saveLines(); renderAll(); updateUndoBtns(); }
function redo(){ if(!REDO.length)return; UNDO.push(JSON.stringify(LINES)); LINES=JSON.parse(REDO.pop()); saveLines(); renderAll(); updateUndoBtns(); }
function updateUndoBtns(){
  document.getElementById('btnUndo').classList.toggle('disabled',!UNDO.length);
  document.getElementById('btnRedo').classList.toggle('disabled',!REDO.length);
}

// ==================== FETCH ====================
async function fetchYahoo(sym,interval,range){
  const url='https://query1.finance.yahoo.com/v8/finance/chart/'+encodeURIComponent(sym)
    +'?interval='+interval+'&range='+range+'&includePrePost=false';
  const ctrl=new AbortController();
  const t=setTimeout(()=>ctrl.abort(),9000);
  try{
    const r=await fetch('https://corsproxy.io/?'+encodeURIComponent(url),{signal:ctrl.signal});
    clearTimeout(t);
    if(!r.ok)return null;
    const j=await r.json();
    const res=j?.chart?.result?.[0];
    const q=res?.indicators?.quote?.[0];
    const ts=res?.timestamp||[];
    if(!q||!ts.length)return null;
    const bars=[];
    for(let i=0;i<ts.length;i++){
      const c=q.close?.[i],h=q.high?.[i],l=q.low?.[i],o=q.open?.[i];
      if(c!=null&&h!=null&&l!=null)bars.push({t:ts[i],o:o||c,h,l,c});
    }
    return bars.length>=2?bars:null;
  }catch{clearTimeout(t);return null;}
}

async function loadAll(){
  document.getElementById('updTime').textContent='…';
  loadView();
  const visibleIds=CFG.order.filter(id=>CFG.visible[id]);
  // Fetch sequentially with small delay to avoid proxy rate limits
  for(const id of visibleIds){
    const tf=TF_DEFS[id];
    let bars=await fetchYahoo(SYM,tf.interval,tf.range);
    if(!bars){
      await new Promise(r=>setTimeout(r,600));
      bars=await fetchYahoo(SYM,tf.interval,tf.range);
    }
    // Try fallback range (e.g. 5m: 1d→5d when market closed)
    if(!bars && tf.fallbackRange){
      await new Promise(r=>setTimeout(r,400));
      bars=await fetchYahoo(SYM,tf.interval,tf.fallbackRange);
    }
    DATA[id]=bars;
    if(!VIEW[id]) VIEW[id]={offsetT:0,scaleT:1,offsetP:0,scaleP:1};
    if(bars){
      if(LOCKED.has(id)){
        // locked: keep restored view as-is
      } else if(!_firstLoadDone){
        // first load, unlocked: set sensible default zoom + align latest
        setDefaultZoom(id);
      } else {
        // subsequent refresh, unlocked: follow latest
        alignRight(id);
      }
    }
    renderChart(id);
  }
  loadLines();
  renderAll();
  _firstLoadDone=true;
  const n=new Date();
  document.getElementById('updTime').textContent=n.getHours()+':'+String(n.getMinutes()).padStart(2,'0');
  updateDeviationRate();
}
let _firstLoadDone=false;

// 25-day moving-average deviation rate (using daily data of current symbol)
async function updateDeviationRate(){
  try{
    // Use already-loaded daily data if available, else fetch
    let daily=DATA['1d'];
    if(!daily||daily.length<26){
      daily=await fetchYahoo(SYM,'1d','3mo');
    }
    if(!daily||daily.length<26){ setDevDisplay(null); return; }
    const closes=daily.map(b=>b.c);
    const last=closes[closes.length-1];
    const ma25=closes.slice(-25).reduce((a,b)=>a+b,0)/25;
    const dev=(last-ma25)/ma25*100;
    setDevDisplay(dev);
  }catch{ setDevDisplay(null); }
}
function setDevDisplay(dev){
  const wrap=document.getElementById('devRate');
  const val=document.getElementById('devVal');
  if(!wrap||!val)return;
  if(dev===null||!isFinite(dev)){ val.textContent='--'; val.style.color='#ccc'; return; }
  const s=(dev>=0?'+':'')+dev.toFixed(2)+'%';
  val.textContent=s;
  // Color thresholds (value only; label stays time color)
  let color='#fff';
  if(dev>7) color='#ff3d5a';        // red
  else if(dev>5) color='#f5c842';   // yellow
  else if(dev<-5) color='#00c4ff';  // blue
  else color='#fff';                // normal white
  val.style.color=color;
}

// Show recent bars. Uses configured candle count, else DEFAULT_VISIBLE_BARS.
const DEFAULT_VISIBLE_BARS = 60;
function setDefaultZoom(tfId){
  const bars=DATA[tfId];
  if(!bars||bars.length<2)return;
  const v=VIEW[tfId];
  const cm=buildCompMap(bars);
  const total=cm.compArr[cm.compArr.length-1]-cm.compArr[0]||1;
  const cfgN=CFG.candles[tfId]||0;
  const showN=Math.min(cfgN>0?cfgN:DEFAULT_VISIBLE_BARS, bars.length);
  const visC=cm.compGap*showN;
  v.scaleT=Math.max(0.2,Math.min(50, total/visC));
  alignRight(tfId);
}
// Apply visible-bar count to a chart's zoom (from settings slider)
function applyCandleZoom(tfId){
  const bars=DATA[tfId];
  if(!bars||bars.length<2||!VIEW[tfId])return;
  const v=VIEW[tfId];
  const cm=buildCompMap(bars);
  const total=cm.compArr[cm.compArr.length-1]-cm.compArr[0]||1;
  const cfgN=CFG.candles[tfId]||0;
  const showN=Math.min(cfgN>0?cfgN:DEFAULT_VISIBLE_BARS, bars.length);
  const visC=cm.compGap*showN;
  v.scaleT=Math.max(0.2,Math.min(50, total/visC));
  alignRight(tfId);
}

// ==================== COMPRESSED TIME AXIS ====================
// Build a per-chart piecewise-linear map: realTime -> compressedTime.
// Gaps between consecutive bars larger than (median bar interval * GAP_FACTOR)
// are compressed to (median interval * GAP_COMPRESS) so closed-market periods shrink.
// Closed-market gaps are compressed in ABSOLUTE real-time terms so that
// every chart maps the same real timestamp to the same compressed time.
// A gap's overage beyond NORMAL_GAP_SEC is kept at GAP_KEEP ratio.
const GAP_KEEP = 0.10;            // keep 10% of the closed-market overage
const GAP_THRESHOLD_SEC = 3*3600; // gaps longer than 3h are "closed market"

function buildCompMap(bars){
  const realArr=[bars[0].t];
  const compArr=[0];
  let comp=0;
  for(let i=1;i<bars.length;i++){
    let d=bars[i].t-bars[i-1].t;
    if(d>GAP_THRESHOLD_SEC){
      // keep threshold + a fraction of the overage (absolute seconds)
      d = GAP_THRESHOLD_SEC + (d-GAP_THRESHOLD_SEC)*GAP_KEEP;
    }
    comp+=d;
    realArr.push(bars[i].t);
    compArr.push(comp);
  }
  // median real interval (for candle width / bar spacing)
  const diffs=[];
  for(let i=1;i<bars.length;i++) diffs.push(bars[i].t-bars[i-1].t);
  diffs.sort((a,b)=>a-b);
  const med=diffs[Math.floor(diffs.length/2)]||1;
  return {realArr,compArr,med,compGap:med};
}

// real time -> compressed time (using a chart's comp map)
function realToComp(t,cm){
  const {realArr,compArr,med,compGap}=cm;
  const n=realArr.length;
  if(t<=realArr[0]) return compArr[0]+(t-realArr[0]); // extrapolate before
  if(t>=realArr[n-1]) return compArr[n-1]+(t-realArr[n-1]); // extrapolate after (live edge)
  let lo=0,hi=n-1;
  while(hi-lo>1){const mid=(lo+hi)>>1; if(realArr[mid]<=t)lo=mid;else hi=mid;}
  // within segment lo->hi: if real gap was compressed, map proportionally onto compressed gap
  const realSpan=realArr[hi]-realArr[lo];
  const compSpan=compArr[hi]-compArr[lo];
  if(realSpan<=0) return compArr[lo];
  return compArr[lo]+(t-realArr[lo])/realSpan*compSpan;
}

// ==================== SCALE (compressed-time axis) ====================
function getScale(tfId){
  const bars=DATA[tfId];
  if(!bars||bars.length<2)return null;
  const cv=document.getElementById('cv_'+tfId);
  if(!cv)return null;
  const W=cv.offsetWidth||window.innerWidth;
  const H=CFG.heights[tfId]||200;
  const cw=W-PAD.l-PAD.r, ch=H-PAD.t-PAD.b;
  const v=VIEW[tfId]||{offsetT:0,scaleT:1,offsetP:0,scaleP:1};

  const cm=buildCompMap(bars);
  // compressed-time range of all bars
  const rawMinC=cm.compArr[0], rawMaxC=cm.compArr[cm.compArr.length-1];
  const rawCR=rawMaxC-rawMinC||1;
  const visCR=rawCR/v.scaleT;
  const midC=(rawMinC+rawMaxC)/2+v.offsetT;
  const minC=midC-visCR/2, maxC=midC+visCR/2;

  // Price axis — based on bars currently visible in the time window,
  // so each chart's vertical scale fits what's on screen.
  let vMinP=Infinity, vMaxP=-Infinity;
  for(let bi=0;bi<bars.length;bi++){
    const c=cm.compArr[bi];
    if(c<minC-1e-9||c>maxC+1e-9) continue;
    if(bars[bi].l<vMinP) vMinP=bars[bi].l;
    if(bars[bi].h>vMaxP) vMaxP=bars[bi].h;
  }
  if(!isFinite(vMinP)||!isFinite(vMaxP)){
    vMinP=Math.min(...bars.map(b=>b.l));
    vMaxP=Math.max(...bars.map(b=>b.h));
  }
  const rawVR=(vMaxP-vMinP)||1;
  // small padding so candles don't touch edges
  const padP=rawVR*0.05;
  const visVR=(rawVR+padP*2)/v.scaleP;
  const midP=(vMinP+vMaxP)/2+v.offsetP;
  const minP=midP-visVR/2, maxP=midP+visVR/2;

  return {bars,cm,W,H,cw,ch,minC,maxC,cr:maxC-minC||1,minP,maxP,vr:maxP-minP||1,
          compGap:cm.compGap};
}
function pToY(p,sc){return PAD.t+sc.ch-(p-sc.minP)/sc.vr*sc.ch;}
function yToP(y,sc){return sc.maxP-(y-PAD.t)/sc.ch*sc.vr;}
// Compressed-time <-> X
function cToX(c,sc){return PAD.l+(c-sc.minC)/sc.cr*sc.cw;}
function xToC(x,sc){return sc.minC+(x-PAD.l)/sc.cw*sc.cr;}
// Real time <-> X (via compressed map)
function tToX(t,sc){return cToX(realToComp(t,sc.cm),sc);}
// X -> real time: invert comp map
function xToT(x,sc){
  const c=xToC(x,sc);
  const {realArr,compArr}=sc.cm;
  const n=compArr.length;
  if(c<=compArr[0]) return realArr[0]+(c-compArr[0]);
  if(c>=compArr[n-1]) return realArr[n-1]+(c-compArr[n-1]);
  let lo=0,hi=n-1;
  while(hi-lo>1){const mid=(lo+hi)>>1; if(compArr[mid]<=c)lo=mid;else hi=mid;}
  const compSpan=compArr[hi]-compArr[lo];
  const realSpan=realArr[hi]-realArr[lo];
  if(compSpan<=0) return realArr[lo];
  return realArr[lo]+(c-compArr[lo])/compSpan*realSpan;
}

// Adjust offsetT so latest bar sits RIGHT_MARGIN bars in from right edge
const RIGHT_MARGIN_BARS = 5;
function alignRight(tfId){
  const bars=DATA[tfId];
  if(!bars||bars.length<2)return;
  const v=VIEW[tfId];
  if(!v)return;
  const cm=buildCompMap(bars);
  const rawMinC=cm.compArr[0], rawMaxC=cm.compArr[cm.compArr.length-1];
  const rawCR=rawMaxC-rawMinC||1;
  const visCR=rawCR/v.scaleT;
  const margin=cm.compGap*RIGHT_MARGIN_BARS;
  // want maxC = rawMaxC + margin; maxC = midC+visCR/2; midC=(rawMinC+rawMaxC)/2+offsetT
  v.offsetT = rawMaxC + margin - visCR/2 - (rawMinC+rawMaxC)/2;
}

// ==================== RENDER ====================
function renderAll(){CFG.order.filter(id=>CFG.visible[id]).forEach(id=>renderChart(id));}

function renderChart(tfId){
  const cv=document.getElementById('cv_'+tfId);
  if(!cv)return;
  const dpr=window.devicePixelRatio||1;
  const W=cv.offsetWidth||window.innerWidth;
  const H=CFG.heights[tfId]||200;
  cv.width=W*dpr; cv.height=H*dpr; cv.style.height=H+'px';
  const ctx=cv.getContext('2d');
  ctx.scale(dpr,dpr);
  ctx.fillStyle='#0a0a0a'; ctx.fillRect(0,0,W,H);

  const bars=DATA[tfId];
  if(!bars){
    ctx.fillStyle='#555'; ctx.font='12px Share Tech Mono'; ctx.textAlign='center';
    ctx.fillText('データ取得中...',W/2,H/2); return;
  }
  const sc=getScale(tfId);
  if(!sc)return;

  // Grid (horizontal price lines)
  ctx.strokeStyle='rgba(60,60,60,.8)'; ctx.lineWidth=.5;
  for(let i=0;i<=4;i++){
    const yy=PAD.t+(sc.ch/4)*i;
    ctx.beginPath(); ctx.moveTo(PAD.l,yy); ctx.lineTo(W-PAD.r,yy); ctx.stroke();
    ctx.fillStyle='#666'; ctx.font='9px Share Tech Mono'; ctx.textAlign='left';
    ctx.fillText(Math.round(sc.maxP-(sc.vr/4)*i).toLocaleString(),W-PAD.r+3,yy+3);
  }

  // Boundary vertical lines + date labels at bottom (adaptive + thinned)
  ctx.font='8px Share Tech Mono'; ctx.textAlign='center';
  const intraday=(tfId==='5m'||tfId==='15m'||tfId==='1h');
  // First pass: collect boundary positions
  const boundaries=[];
  let lastKey=null;
  for(let bi=0;bi<bars.length;bi++){
    const d=new Date(bars[bi].t*1000);
    let key, label;
    if(intraday){
      key=d.getFullYear()+'-'+d.getMonth()+'-'+d.getDate();
      label=(d.getMonth()+1)+'/'+d.getDate();
    } else if(tfId==='1d'){
      key=d.getFullYear()+'-'+d.getMonth();
      label=(d.getFullYear()+'/'+(d.getMonth()+1));
    } else {
      key=d.getFullYear();
      label=''+d.getFullYear();
    }
    if(key!==lastKey){
      lastKey=key;
      const cx=tToX(bars[bi].t,sc);
      boundaries.push({cx,label});
    }
  }
  // Draw vertical lines for all in-view boundaries
  ctx.strokeStyle='rgba(90,90,90,.25)'; ctx.lineWidth=.5;
  boundaries.forEach(b=>{
    if(b.cx<PAD.l||b.cx>W-PAD.r)return;
    ctx.beginPath(); ctx.moveTo(b.cx,PAD.t); ctx.lineTo(b.cx,PAD.t+sc.ch); ctx.stroke();
  });
  // Draw labels with thinning (min spacing in px)
  const MIN_LABEL_PX=42;
  let lastLabelX=-Infinity;
  ctx.fillStyle='#777';
  boundaries.forEach(b=>{
    if(b.cx<PAD.l||b.cx>W-PAD.r)return;
    if(b.cx-lastLabelX<MIN_LABEL_PX)return;
    lastLabelX=b.cx;
    ctx.fillText(b.label,b.cx,H-5);
  });

  // Candles (compressed-time X)
  // Draw all bars (visible count is controlled by zoom/scaleT)
  const bw=Math.max(1, (sc.compGap/sc.cr)*sc.cw*0.6);
  for(let bi=0;bi<bars.length;bi++){
    const bar=bars[bi];
    const cx=tToX(bar.t,sc);
    if(cx<PAD.l-bw*2||cx>W-PAD.r+bw*2)continue;
    const bull=bar.c>=bar.o;
    ctx.strokeStyle=ctx.fillStyle=bull?'#ff3d5a':'#00c4ff';
    ctx.lineWidth=1;
    ctx.beginPath(); ctx.moveTo(cx,pToY(bar.h,sc)); ctx.lineTo(cx,pToY(bar.l,sc)); ctx.stroke();
    const y1=pToY(Math.max(bar.o,bar.c),sc), y2=pToY(Math.min(bar.o,bar.c),sc);
    ctx.fillRect(cx-bw/2,y1,bw,Math.max(1,y2-y1));
  }

  // Current price tag only
  const cur=bars.at(-1).c;
  const tag=document.getElementById('tag_'+tfId);
  if(tag){
    const ty=pToY(cur,sc);
    if(ty<PAD.t || ty>PAD.t+sc.ch){
      tag.style.display='none';
    } else {
      tag.style.display='';
      tag.textContent=Math.round(cur).toLocaleString();
      tag.style.top=ty+'px';
    }
  }

  // Saved lines
  LINES.forEach(line=>drawLine(ctx,line,sc,W,H,false,SELECTED===line.id));
  // In-progress
  if(DRAW&&DRAW.tfId===tfId)drawLine(ctx,DRAW,sc,W,H,true,false);
}

function drawLine(ctx,line,sc,W,H,preview,sel){
  ctx.save();
  ctx.strokeStyle=line.color||'#fff';
  ctx.lineWidth=sel?1.5:0.8;
  ctx.globalAlpha=preview?0.6:1;
  if(sel){ctx.shadowColor=line.color;ctx.shadowBlur=5;}
  ctx.setLineDash(line.style==='dash'?[5,4]:[]);

  if(line.type==='hline'){
    const y=pToY(line.p1Price,sc);
    if(y<PAD.t-4||y>PAD.t+sc.ch+4){ctx.restore();return;}
    ctx.beginPath(); ctx.moveTo(PAD.l,y); ctx.lineTo(W-PAD.r,y); ctx.stroke();
    ctx.setLineDash([]); ctx.fillStyle=line.color; ctx.globalAlpha=.8;
    ctx.font='9px Share Tech Mono'; ctx.textAlign='left';
    ctx.fillText(Math.round(line.p1Price).toLocaleString(),W-PAD.r+3,y+3);
  } else if(line.type==='line'){
    const x1=tToX(line.p1Time,sc),y1=pToY(line.p1Price,sc);
    const x2=tToX(line.p2Time,sc),y2=pToY(line.p2Price,sc);
    ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(x2,y2); ctx.stroke();
    if(sel){
      ctx.setLineDash([]); ctx.globalAlpha=1; ctx.shadowBlur=0;
      [[x1,y1],[x2,y2]].forEach(([ex,ey])=>{
        ctx.beginPath(); ctx.arc(ex,ey,6,0,Math.PI*2);
        ctx.fillStyle=line.color; ctx.fill();
        ctx.strokeStyle='#fff'; ctx.lineWidth=1.2; ctx.stroke();
      });
    }
  } else if(line.type==='channel'){
    const x1=tToX(line.p1Time,sc),y1=pToY(line.p1Price,sc);
    const x2=tToX(line.p2Time,sc),y2=pToY(line.p2Price,sc);
    ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(x2,y2); ctx.stroke();
    if(line.phase===2){
      // Parallel line defined in PRICE space: each endpoint shifted by dP price.
      const dP=line.p3Price-line.p1Price;
      const y1b=pToY(line.p1Price+dP,sc), y2b=pToY(line.p2Price+dP,sc);
      ctx.beginPath(); ctx.moveTo(x1,y1b); ctx.lineTo(x2,y2b); ctx.stroke();
      ctx.globalAlpha=0.07; ctx.fillStyle=line.color;
      ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(x2,y2); ctx.lineTo(x2,y2b); ctx.lineTo(x1,y1b); ctx.closePath(); ctx.fill();
      if(sel){
        ctx.setLineDash([]); ctx.globalAlpha=1; ctx.shadowBlur=0;
        [[x1,y1],[x2,y2],[x1,y1b],[x2,y2b]].forEach(([ex,ey])=>{
          ctx.beginPath(); ctx.arc(ex,ey,5,0,Math.PI*2);
          ctx.fillStyle=line.color; ctx.fill();
          ctx.strokeStyle='#fff'; ctx.lineWidth=1; ctx.stroke();
        });
      }
    }
  }
  ctx.setLineDash([]); ctx.restore();
}

// ==================== HIT TEST ====================
function hitLine(line,x,y,sc,thr=14){
  if(line.type==='hline'){
    return Math.abs(y-pToY(line.p1Price,sc))<thr;
  }
  const x1=tToX(line.p1Time,sc),y1=pToY(line.p1Price,sc);
  const x2=tToX(line.p2Time,sc),y2=pToY(line.p2Price,sc);
  const dx=x2-x1,dy=y2-y1,len2=dx*dx+dy*dy;
  if(len2===0)return Math.hypot(x-x1,y-y1)<thr;
  const t=Math.max(0,Math.min(1,((x-x1)*dx+(y-y1)*dy)/len2));
  if(Math.hypot(x-(x1+t*dx),y-(y1+t*dy))<thr)return true;
  if(line.type==='channel'&&line.phase===2){
    const dP=line.p3Price-line.p1Price;
    const y1b=pToY(line.p1Price+dP,sc), y2b=pToY(line.p2Price+dP,sc);
    // distance to parallel segment
    const dxb=x2-x1, dyb=y2b-y1b, len2b=dxb*dxb+dyb*dyb;
    const tb=len2b>0?Math.max(0,Math.min(1,((x-x1)*dxb+(y-y1b)*dyb)/len2b)):0;
    if(Math.hypot(x-(x1+tb*dxb),y-(y1b+tb*dyb))<thr)return true;
  }
  return false;
}

function hitEndpoint(line,x,y,sc,thr=18){
  if(line.type==='hline')return null;
  const x1=tToX(line.p1Time,sc),y1=pToY(line.p1Price,sc);
  const x2=tToX(line.p2Time,sc),y2=pToY(line.p2Price,sc);
  if(Math.hypot(x-x1,y-y1)<thr)return 'p1';
  if(Math.hypot(x-x2,y-y2)<thr)return 'p2';
  if(line.type==='channel'&&line.phase===2){
    const dP=line.p3Price-line.p1Price;
    const y1b=pToY(line.p1Price+dP,sc), y2b=pToY(line.p2Price+dP,sc);
    if(Math.hypot(x-x1,y-y1b)<thr)return 'c1';
    if(Math.hypot(x-x2,y-y2b)<thr)return 'c2';
  }
  return null;
}

// ==================== TOUCH HANDLING ====================
// Each chart gets its own touch handler
// State is local to each handler to avoid cross-contamination
function attachChart(tfId){
  const cv=document.getElementById('cv_'+tfId);
  if(!cv)return;

  // Local touch state
  let state = null;
  // state types:
  // {type:'pan', startX, startY, startT, startP}
  // {type:'pinch', dist0, dx0, dy0}
  // {type:'draw'}
  // {type:'moveLine', lineSnap, ep, startT, startP}

  function pos(e){
    const r=cv.getBoundingClientRect();
    const s=e.touches?e.touches[0]:e;
    return{x:s.clientX-r.left, y:s.clientY-r.top};
  }

  function onStart(e){
    e.preventDefault();
    const sc=getScale(tfId);
    if(!sc)return;

    // 2-finger: pinch (zoom) or parallel swipe (page scroll)
    if(e.touches&&e.touches.length>=2){
      const t1=e.touches[0],t2=e.touches[1];
      state={type:'twoFinger',
        dist0:Math.hypot(t1.clientX-t2.clientX,t1.clientY-t2.clientY),
        dx0:Math.abs(t1.clientX-t2.clientX),
        dy0:Math.abs(t1.clientY-t2.clientY),
        midY0:(t1.clientY+t2.clientY)/2,
        scrollTop0:document.getElementById('charts').scrollTop,
        mode:null, locked:LOCKED.has(tfId)};
      return;
    }

    const p=pos(e);
    const t=xToT(p.x,sc), pr=yToP(p.y,sc);

    // Delete mode
    if(DEL_MODE){
      const hit=[...LINES].reverse().find(l=>hitLine(l,p.x,p.y,sc));
      if(hit){pushUndo(); LINES=LINES.filter(l=>l.id!==hit.id); saveLines(); renderAll();}
      return;
    }

    // Pan mode
    if(TOOL==='pan'){
      if(LOCKED.has(tfId)){state=null;return;}
      // Check endpoint hit on selected line first
      if(SELECTED){
        const sel=LINES.find(l=>l.id===SELECTED);
        if(sel){
          const ep=hitEndpoint(sel,p.x,p.y,sc);
          if(ep){
            state={type:'moveLine', lineSnap:JSON.parse(JSON.stringify(sel)), ep, startT:t, startP:pr, moved:false, undoSnap:JSON.stringify(LINES)};
            return;
          }
        }
      }
      // Check line hit
      const hit=[...LINES].reverse().find(l=>hitLine(l,p.x,p.y,sc));
      if(hit){
        SELECTED=hit.id;
        state={type:'moveLine', lineSnap:JSON.parse(JSON.stringify(hit)), ep:null, startT:t, startP:pr, moved:false, undoSnap:JSON.stringify(LINES)};
        renderAll(); return;
      }
      SELECTED=null;
      state={type:'pan', lastX:p.x, lastY:p.y};
      renderAll(); return;
    }

    // Draw tools
    if(TOOL==='channel'&&DRAW&&DRAW.type==='channel'&&DRAW.phase===1){
      DRAW.phase=2; DRAW.p3Price=pr;
      state={type:'draw'};
    } else {
      DRAW={type:TOOL,tfId,color:COLOR,style:STYLE,p1Time:t,p1Price:pr,p2Time:t,p2Price:pr,phase:TOOL==='channel'?1:undefined};
      state={type:'draw'};
    }
    renderAll();
  }

  function onMove(e){
    e.preventDefault();
    if(!state)return;
    const sc=getScale(tfId);
    if(!sc)return;

    // Two-finger: decide scroll (parallel) vs zoom (pinch)
    if(state.type==='twoFinger'&&e.touches&&e.touches.length>=2){
      const t1=e.touches[0],t2=e.touches[1];
      const dist=Math.hypot(t1.clientX-t2.clientX,t1.clientY-t2.clientY);
      const midY=(t1.clientY+t2.clientY)/2;
      // Determine mode on first significant move
      if(!state.mode){
        const distChange=Math.abs(dist-state.dist0);
        const midMove=Math.abs(midY-state.midY0);
        if(distChange>midMove && distChange>8) state.mode='zoom';
        else if(midMove>8) state.mode='scroll';
      }
      if(state.mode==='scroll'){
        // Scroll the whole page
        const charts=document.getElementById('charts');
        charts.scrollTop=state.scrollTop0-(midY-state.midY0);
        return;
      }
      if(state.mode==='zoom'){
        if(state.locked) return;
        const ratio=dist/state.dist0;
        const v=VIEW[tfId];
        if(state.dx0>=state.dy0){
          v.scaleT=Math.max(0.2,Math.min(30,v.scaleT*ratio));
        } else {
          v.scaleP=Math.max(0.2,Math.min(30,v.scaleP*ratio));
        }
        state.dist0=dist;
        renderAll();
      }
      return;
    }

    const p=pos(e);
    const t=xToT(p.x,sc), pr=yToP(p.y,sc);

    if(state.type==='pan'){
      const dxPx=p.x-state.lastX;
      const dyPx=p.y-state.lastY;
      // index per pixel = ir/cw, price per pixel = vr/ch
      VIEW[tfId].offsetT -= dxPx*(sc.cr/sc.cw);
      VIEW[tfId].offsetP += dyPx*(sc.vr/sc.ch);
      state.lastX=p.x; state.lastY=p.y;
      renderAll(); return;
    }

    if(state.type==='moveLine'){
      state.moved=true;
      const dT=t-state.startT, dP=pr-state.startP;
      const idx=LINES.findIndex(l=>l.id===state.lineSnap.id);
      if(idx<0)return;
      const l=LINES[idx];
      const snap=state.lineSnap;
      const ep=state.ep;
      if(ep==='p1'){l.p1Time=snap.p1Time+dT; l.p1Price=snap.p1Price+dP;}
      else if(ep==='p2'){l.p2Time=snap.p2Time+dT; l.p2Price=snap.p2Price+dP;}
      else if(ep==='c1'||ep==='c2'){l.p3Price=snap.p3Price+dP;}
      else{
        // move whole line
        if(l.type==='hline'){l.p1Price=snap.p1Price+dP;}
        else{
          l.p1Time=snap.p1Time+dT; l.p1Price=snap.p1Price+dP;
          l.p2Time=snap.p2Time+dT; l.p2Price=snap.p2Price+dP;
          if(l.type==='channel'&&l.phase===2)l.p3Price=snap.p3Price+dP;
        }
      }
      renderAll(); return;
    }

    if(state.type==='draw'&&DRAW){
      if(DRAW.type==='channel'&&DRAW.phase===2){DRAW.p3Price=pr;}
      else{DRAW.p2Time=t; DRAW.p2Price=pr;}
      renderAll();
    }
  }

  function onEnd(e){
    e.preventDefault();
    if(!state)return;

    if(state.type==='moveLine'){
      if(state.moved){
        UNDO.push(state.undoSnap); REDO=[]; updateUndoBtns();
        saveLines();
      }
      state=null; return;
    }

    if(state.type==='twoFinger'){const wasZoom=state.mode==='zoom';state=null;if(wasZoom)saveView();return;}
    if(state.type==='pan'){state=null;saveView();return;}

    // draw end
    if(state.type==='draw'&&DRAW){
      if(DRAW.type==='channel'&&DRAW.phase===1){state=null;return;}// wait phase2
      if(DRAW.type==='channel'&&DRAW.phase===2){
        pushUndo(); LINES.push({...DRAW,id:Date.now()}); saveLines(); DRAW=null; state=null; renderAll(); return;
      }
      // line/hline min drag
      const sc=getScale(tfId);
      if(sc&&DRAW.type!=='hline'){
        const dx=tToX(DRAW.p2Time,sc)-tToX(DRAW.p1Time,sc);
        const dy=pToY(DRAW.p2Price,sc)-pToY(DRAW.p1Price,sc);
        if(Math.hypot(dx,dy)<8){DRAW=null;state=null;renderAll();return;}
      }
      pushUndo(); LINES.push({...DRAW,id:Date.now()}); saveLines(); DRAW=null;
    }
    state=null;
    renderAll();
  }

  cv.addEventListener('touchstart',onStart,{passive:false});
  cv.addEventListener('touchmove',onMove,{passive:false});
  cv.addEventListener('touchend',onEnd,{passive:false});
  cv.addEventListener('mousedown',onStart);
  cv.addEventListener('mousemove',e=>{if(e.buttons)onMove(e);});
  cv.addEventListener('mouseup',onEnd);
}

// ==================== TOOLBAR ====================
function setTool(t,btn){
  TOOL=t; DRAW=null;
  if(DEL_MODE){DEL_MODE=false;document.getElementById('btnDel').classList.remove('del-mode');}
  document.querySelectorAll('.tb-btn[id^=tool]').forEach(b=>b.classList.remove('active'));
  if(btn)btn.classList.add('active');
  else document.getElementById('tool'+t.charAt(0).toUpperCase()+t.slice(1))?.classList.add('active');
}
function toggleDel(){
  DEL_MODE=!DEL_MODE;
  DRAW=null; SELECTED=null;
  document.getElementById('btnDel').classList.toggle('del-mode',DEL_MODE);
  if(DEL_MODE)toast('削除モード — ラインをタップ');
  renderAll();
}
function setSym(v){SYM=v; CFG.sym=v; saveCfg(); loadAll();}
function setStyle(s,btn){
  STYLE=s;
  document.querySelectorAll('.sty').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  if(SELECTED){
    pushUndo();
    const l=LINES.find(l=>l.id===SELECTED);
    if(l){l.style=s; saveLines(); renderAll();}
  }
}

// Auto refresh
let _autoTimer=null;
function setAuto(v){
  CFG.auto=v; saveCfg();
  if(_autoTimer){clearInterval(_autoTimer);_autoTimer=null;}
  if(parseInt(v)>0)_autoTimer=setInterval(loadAll,parseInt(v)*1000);
}

// Palette
function renderPalRow(){
  const row=document.getElementById('palRow');
  if(!row)return;
  row.innerHTML='';
  row.style.display='flex'; row.style.gap='5px'; row.style.alignItems='center';
  for(let i=0;i<CFG.palCount;i++){
    const d=document.createElement('div');
    d.className='pal'+(i===PAL_ACTIVE?' active':'');
    d.style.background=PALETTE[i]||'#fff';
    d.onclick=()=>palClick(i);
    // Long press to edit
    let lt=null;
    d.addEventListener('touchstart',()=>{lt=setTimeout(()=>{lt=null;palEditOpen(i);},500);},{passive:true});
    d.addEventListener('touchend',()=>{if(lt){clearTimeout(lt);lt=null;}},{passive:true});
    d.addEventListener('touchmove',()=>{if(lt){clearTimeout(lt);lt=null;}},{passive:true});
    d.addEventListener('contextmenu',e=>{e.preventDefault();palEditOpen(i);});
    row.appendChild(d);
  }
}
function palClick(i){
  PAL_ACTIVE=i; COLOR=PALETTE[i];
  renderPalRow();
  if(SELECTED){
    pushUndo();
    const l=LINES.find(l=>l.id===SELECTED);
    if(l){l.color=COLOR; saveLines(); renderAll();}
  }
}
let _palEditIdx=null;
function palEditOpen(i){
  _palEditIdx=i;
  const pk=document.getElementById('palPicker');
  pk.value=PALETTE[i]||'#ffffff';
  pk.oninput=pk.onchange=function(){
    PALETTE[_palEditIdx]=this.value;
    savePal(); renderPalRow();
    if(_palEditIdx===PAL_ACTIVE)COLOR=this.value;
  };
  pk.click();
}

// Lock
function toggleLock(tfId){
  if(LOCKED.has(tfId))LOCKED.delete(tfId);
  else LOCKED.add(tfId);
  saveLocks();
  const btn=document.getElementById('lock_'+tfId);
  if(btn){
    btn.classList.toggle('locked',LOCKED.has(tfId));
    const path=btn.querySelector('path');
    if(path)path.setAttribute('d',LOCKED.has(tfId)?'M4 5.5V4a2 2 0 0 1 4 0v1.5':'M4 5.5V3a2.5 2.5 0 0 1 4.5-.5');
  }
}

// Toast
let _tt=null;
function toast(msg){
  const el=document.getElementById('toast');
  el.textContent=msg; el.classList.add('show');
  if(_tt)clearTimeout(_tt);
  _tt=setTimeout(()=>el.classList.remove('show'),2000);
}

// ==================== SETTINGS ====================
function openSettings(){renderSettings();document.getElementById('settingsOverlay').style.display='block';document.getElementById('settingsPanel').style.display='block';}
function closeSettings(){document.getElementById('settingsOverlay').style.display='none';document.getElementById('settingsPanel').style.display='none';}

function setTbBg(c){CFG.tbBg=c;document.getElementById('toolbar').style.background=c;saveCfg();}

function renderSettings(){
  document.getElementById('cfgTbBg').value=CFG.tbBg||'#1e1e1e';

  // Palette count
  const cnt=document.getElementById('cfgPalCnt');
  cnt.innerHTML='';
  for(let i=3;i<=10;i++){
    const b=document.createElement('button');
    b.className='cfg-cnt-btn'+(i===CFG.palCount?' active':'');
    b.textContent=i;
    b.onclick=()=>{CFG.palCount=i;saveCfg();renderPalRow();renderSettings();};
    cnt.appendChild(b);
  }

  // Palette colors
  const pc=document.getElementById('cfgPalColors');
  pc.innerHTML='';
  for(let i=0;i<CFG.palCount;i++){
    const row=document.createElement('div');
    row.className='cfg-row';
    row.innerHTML=`<div style="width:24px;height:24px;border-radius:50%;background:${PALETTE[i]||'#fff'};border:1px solid #555;flex-shrink:0"></div><div class="cfg-label">色 ${i+1}</div><input type="color" value="${PALETTE[i]||'#fff'}" style="width:32px;height:26px;border:none;border-radius:3px;cursor:pointer;padding:1px;">`;
    row.querySelector('input').oninput=function(){PALETTE[i]=this.value;savePal();renderPalRow();renderSettings();};
    pc.appendChild(row);
  }

  // Order (with visibility checkbox)
  const ord=document.getElementById('cfgOrder');
  ord.innerHTML='';
  CFG.order.forEach((id,i)=>{
    const tf=TF_DEFS[id];
    const row=document.createElement('div');
    row.className='cfg-row'; row.draggable=true; row.dataset.i=i;
    row.innerHTML=`<span style="color:#555;cursor:grab;margin-right:4px">☰</span><div class="cfg-label">${tf.label}</div><input type="checkbox" ${CFG.visible[id]?'checked':''} style="width:18px;height:18px;accent-color:var(--gold);cursor:pointer;flex-shrink:0">`;
    const chk=row.querySelector('input[type=checkbox]');
    chk.onchange=function(){
      CFG.visible[id]=this.checked;
      saveCfg(); rebuildCharts(); loadAll(); renderSettings();
    };
    // prevent drag from starting on checkbox
    chk.addEventListener('mousedown',e=>e.stopPropagation());
    row.addEventListener('dragstart',e=>e.dataTransfer.setData('text/plain',i));
    row.addEventListener('dragover',e=>e.preventDefault());
    row.addEventListener('drop',e=>{
      e.preventDefault();
      const from=parseInt(e.dataTransfer.getData('text/plain'));
      if(from===i)return;
      const arr=[...CFG.order];
      const [m]=arr.splice(from,1);arr.splice(i,0,m);
      CFG.order=arr;saveCfg();rebuildCharts();renderSettings();
    });
    ord.appendChild(row);
  });

  // Heights (all TFs)
  const hts=document.getElementById('cfgHeights');
  hts.innerHTML='';
  CFG.order.forEach(id=>{
    const tf=TF_DEFS[id],h=CFG.heights[id]||200;
    const row=document.createElement('div');row.className='cfg-row';
    row.innerHTML=`<div class="cfg-label">${tf.label}</div><input type="range" class="cfg-range" min="80" max="500" value="${h}"><div class="cfg-val">${h}px</div>`;
    const inp=row.querySelector('input');
    inp.oninput=function(){
      CFG.heights[id]=parseInt(this.value);
      row.querySelector('.cfg-val').textContent=this.value+'px';
      saveCfg(); renderAll();
    };
    hts.appendChild(row);
  });

  // Candles (all TFs)
  const can=document.getElementById('cfgCandles');
  can.innerHTML='';
  CFG.order.forEach(id=>{
    const tf=TF_DEFS[id],n=CFG.candles[id]||0;
    const row=document.createElement('div');row.className='cfg-row';
    row.innerHTML=`<div class="cfg-label">${tf.label}</div><input type="range" class="cfg-range" min="0" max="300" step="10" value="${n}"><div class="cfg-val">${n||'自動'}</div>`;
    const inp=row.querySelector('input');
    inp.oninput=function(){
      CFG.candles[id]=parseInt(this.value);
      row.querySelector('.cfg-val').textContent=this.value==0?'自動':this.value+'本';
      saveCfg(); applyCandleZoom(id); saveView(); renderChart(id);
    };
    can.appendChild(row);
  });
}

// ==================== DOM BUILD ====================
function buildSymSel(){
  const sel=document.getElementById('symSel');
  sel.innerHTML=Object.entries(SYMS).map(([v,l])=>`<option value="${v}">${l}</option>`).join('');
  sel.value=CFG.sym||'NKD=F';
}
function buildAutoSel(){
  const sel=document.getElementById('autoSel');
  sel.innerHTML=[['0','手動'],['30','30秒'],['60','1分'],['180','3分'],['300','5分']]
    .map(([v,l])=>`<option value="${v}">${l}</option>`).join('');
  sel.value=CFG.auto||'0';
}
function rebuildCharts(){
  const container=document.getElementById('charts');
  container.innerHTML='';
  CFG.order.filter(id=>CFG.visible[id]).forEach(id=>{
    const tf=TF_DEFS[id];
    const wrap=document.createElement('div');
    wrap.className='chart-wrap'; wrap.id='wrap_'+id;

    const lockPath=LOCKED.has(id)?'M4 5.5V4a2 2 0 0 1 4 0v1.5':'M4 5.5V3a2.5 2.5 0 0 1 4.5-.5';
    wrap.innerHTML=`
      <div class="chart-label">
        <span>${tf.label}</span>
        <button class="lock-btn${LOCKED.has(id)?' locked':''}" id="lock_${id}" onclick="toggleLock('${id}')" title="スクロールロック">
          <svg width="11" height="11" viewBox="0 0 12 12" fill="none" stroke="${LOCKED.has(id)?'var(--gold)':'#666'}" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round">
            <rect x="2" y="5.5" width="8" height="6" rx="1"/>
            <path id="lockpath_${id}" d="${lockPath}"/>
          </svg>
        </button>
      </div>
      <canvas id="cv_${id}" style="height:${CFG.heights[id]||200}px"></canvas>
      <div class="price-tag" id="tag_${id}"></div>
    `;
    container.appendChild(wrap);
    attachChart(id);
  });
}

// ==================== INIT ====================
window.addEventListener('resize',renderAll);

loadCfg();
loadPal();
loadLocks();
SYM=CFG.sym||'NKD=F';

buildSymSel();
buildAutoSel();
renderPalRow();
COLOR=PALETTE[0]||'#ffffff';

document.getElementById('toolbar').style.background=CFG.tbBg||'#1e1e1e';

rebuildCharts();

// Restore auto refresh
if(parseInt(CFG.auto||'0')>0){
  _autoTimer=setInterval(loadAll,parseInt(CFG.auto)*1000);
}

loadAll();
</script>
