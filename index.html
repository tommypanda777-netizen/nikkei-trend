
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="市場動向">
<link rel="apple-touch-icon" href="icon.jpg">
<title>市場動向</title>
<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Noto+Sans+JP:wght@400;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg:#0a0a0a; --surface:#1a1a1a; --border:#333;
  --bull:#ff3d5a; --bear:#00c4ff; --gold:#f5c842;
  --text:#f0f4f8; --dim:#8a9ab0; --mono:'Share Tech Mono',monospace;
}
*{margin:0;padding:0;box-sizing:border-box;}
body{background:var(--bg);color:var(--text);font-family:'Noto Sans JP',sans-serif;min-height:100vh;}
.wrap{max-width:100%;padding:12px;}

/* HEADER */
header{padding:10px 0 12px;border-bottom:1px solid var(--border);margin-bottom:12px;}
.hdr-top{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:8px;}
.hdr-title{font-family:var(--mono);font-size:10px;color:var(--dim);letter-spacing:3px;margin-bottom:4px;}
.hdr-price{font-family:var(--mono);font-size:32px;font-weight:bold;line-height:1;}
.hdr-change{font-family:var(--mono);font-size:13px;margin-top:4px;}
.hdr-right{display:flex;flex-direction:column;align-items:flex-end;gap:6px;}
.upd-time{font-family:var(--mono);font-size:11px;color:var(--dim);}
.btn-row{display:flex;gap:6px;}
.btn{background:var(--surface);border:1px solid var(--border);color:var(--dim);
  padding:5px 12px;border-radius:4px;font-family:var(--mono);font-size:12px;cursor:pointer;}
select.btn{color-scheme:dark;text-align:center;text-align-last:center;}

/* SECTION */
.sec-lbl{font-family:var(--mono);font-size:10px;color:var(--dim);
  letter-spacing:3px;margin:16px 0 8px;padding-bottom:6px;border-bottom:1px solid var(--border);}

/* CARD */
.card{display:flex;align-items:center;gap:12px;
  background:var(--surface);border:1px solid var(--border);
  border-radius:8px;padding:14px 16px;margin-bottom:8px;}
.card-body{flex:1;min-width:0;}
.card-name{font-size:12px;color:var(--dim);font-family:var(--mono);margin-bottom:4px;letter-spacing:1px;}
.card-val{font-size:20px;font-weight:700;line-height:1.2;}
.card-sub{font-size:12px;color:var(--dim);margin-top:4px;}
.badge{flex-shrink:0;width:60px;height:48px;border-radius:6px;
  display:flex;align-items:center;justify-content:center;
  font-size:14px;font-weight:bold;font-family:var(--mono);letter-spacing:1px;}
.bull .badge,.badge.bull{background:rgba(255,61,90,.2);color:var(--bull);border:1px solid rgba(255,61,90,.5);}
.bear .badge,.badge.bear{background:rgba(0,196,255,.15);color:var(--bear);border:1px solid rgba(0,196,255,.4);}
.neutral .badge,.badge.neutral{background:rgba(138,154,176,.15);color:#aaa;border:1px solid var(--border);}

/* card border accent */
.card.bull{border-left:3px solid var(--bull);}
.card.bear{border-left:3px solid var(--bear);}
.card.neutral{border-left:3px solid var(--border);}

.loading{text-align:center;padding:50px;font-family:var(--mono);font-size:13px;color:var(--dim);letter-spacing:2px;}
.err{background:rgba(255,61,90,.1);border:1px solid rgba(255,61,90,.3);border-radius:8px;
  padding:16px;font-family:var(--mono);font-size:12px;color:var(--bull);text-align:center;}
footer{text-align:center;padding:16px 0 8px;font-family:var(--mono);font-size:9px;
  color:var(--dim);letter-spacing:2px;border-top:1px solid var(--border);margin-top:8px;}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="hdr-top">
      <div>
        <div class="hdr-title">N225 FUTURES SIGNAL</div>
        <div class="hdr-price" id="hdrPrice">---</div>
        <div class="hdr-change" id="hdrChange">---</div>
      </div>
      <div class="hdr-right">
        <span class="upd-time" id="updTime">---</span>
        <div class="btn-row">
          <button class="btn" onclick="loadAll()">↻</button>
          <select class="btn" id="autoSel" onchange="setAuto(this.value)">
            <option value="0">手動</option>
            <option value="60">1分</option>
            <option value="180">3分</option>
            <option value="300">5分</option>
          </select>
        </div>
      </div>
    </div>
  </header>
  <div id="app"><div class="loading">データ取得中...</div></div>
  <footer>MARKET SIGNAL DASHBOARD<br><span style="font-size:8px;opacity:.5">※投資判断は自己責任で</span></footer>
</div>

<script>
// ===== FETCH =====
async function fetchYahoo(sym, interval, range) {
  const url = 'https://query1.finance.yahoo.com/v8/finance/chart/'
    + encodeURIComponent(sym)
    + '?interval=' + interval + '&range=' + range + '&includePrePost=false';
  const ctrl = new AbortController();
  const t = setTimeout(() => ctrl.abort(), 8000);
  try {
    const r = await fetch('https://corsproxy.io/?' + encodeURIComponent(url), {signal: ctrl.signal});
    clearTimeout(t);
    if (!r.ok) return null;
    const j = await r.json();
    const q = j?.chart?.result?.[0]?.indicators?.quote?.[0];
    if (!q) return null;
    const closes = (q.close||[]).filter(v => v!=null && !isNaN(v));
    if (closes.length < 2) return null;
    const highs = (q.high||[]).filter(v=>v!=null&&!isNaN(v));
    const lows  = (q.low ||[]).filter(v=>v!=null&&!isNaN(v));
    return {
      closes,
      highs: highs.length===closes.length ? highs : closes.map(c=>c*1.002),
      lows:  lows.length ===closes.length ? lows  : closes.map(c=>c*0.998),
    };
  } catch { clearTimeout(t); return null; }
}

// ===== MATH =====
function sma(arr, n) {
  if (!arr || arr.length < n) return null;
  return arr.slice(-n).reduce((a,b)=>a+b,0)/n;
}
function ema(arr, n) {
  if (!arr || arr.length < n) return null;
  const k=2/(n+1); let e=arr[0];
  for (let i=1;i<arr.length;i++) e=arr[i]*k+e*(1-k);
  return e;
}
function rsi(arr, n=14) {
  if (!arr || arr.length < n+1) return null;
  const r=arr.slice(-(n+1));
  let g=0,l=0;
  for (let i=1;i<r.length;i++){const d=r[i]-r[i-1]; if(d>0)g+=d; else l-=d;}
  const ag=g/n,al=l/n;
  return al===0?100:100-100/(1+ag/al);
}

// 騰落レシオ近似（直近N日の上昇日数/下降日数）
function toraku(closes, n) {
  if (!closes || closes.length < n+1) return null;
  const recent = closes.slice(-(n+1));
  let up=0, dn=0;
  for (let i=1;i<recent.length;i++){
    const d=recent[i]-recent[i-1];
    if(d>0) up++; else if(d<0) dn++;
  }
  return dn===0 ? 200 : (up/dn)*100;
}

// TFシグナル
function tfSignal(tf) {
  if (!tf || tf.closes.length < 10) return {signal:'neutral',label:'中立',sub:'データ不足'};
  const c=tf.closes, n=c.length;
  const s5=sma(c,Math.min(5,n)), s20=sma(c,Math.min(20,n));
  const e12=ema(c.slice(-26),12), e26=ema(c.slice(-26),26);
  const macd=(e12&&e26)?e12-e26:0;
  const cur=c[n-1];
  const bull=cur>s5&&s5>s20&&macd>0;
  const bear=cur<s5&&s5<s20&&macd<0;
  const slope=c.length>=5?(c[n-1]-c[n-5])/5:0;
  if(bull) return {signal:'bull',label:'上昇',sub:'MA↑ MACD↑'};
  if(bear) return {signal:'bear',label:'下降',sub:'MA↓ MACD↓'};
  return {signal:'neutral',label:'中立',sub:slope>0?'やや上向き':'やや下向き'};
}

// HTML
function fmt(v){return Math.round(v).toLocaleString();}
function pct(v){return (v>0?'+':'')+v.toFixed(2)+'%';}

function card(name, valStr, sub, signal) {
  const cls=signal==='bull'?'bull':signal==='bear'?'bear':'neutral';
  const lbl=signal==='bull'?'買い':signal==='bear'?'売り':'中立';
  return '<div class="card '+cls+'">'
    +'<div class="card-body">'
    +'<div class="card-name">'+name+'</div>'
    +'<div class="card-val">'+valStr+'</div>'
    +(sub?'<div class="card-sub">'+sub+'</div>':'')
    +'</div>'
    +'<div class="badge '+cls+'">'+lbl+'</div>'
    +'</div>';
}

// ===== MAIN =====
async function loadAll() {
  const app=document.getElementById('app');
  app.innerHTML='<div class="loading">データ取得中...</div>';
  try {
    const d1=await fetchYahoo('NKD=F','1d','6mo');
    if(!d1) throw new Error('日足データを取得できませんでした');

    const results = await Promise.allSettled([
      fetchYahoo('NKD=F','1h','5d'),
      fetchYahoo('NKD=F','15m','2d'),
      fetchYahoo('NKD=F','5m','1d'),
      fetchYahoo('^VIX','1d','5d'),
      fetchYahoo('USDJPY=X','1d','10d'),
      fetchYahoo('^TNX','1d','1mo'),   // 米10年
      fetchYahoo('^FVX','1d','1mo'),   // 米5年
      fetchYahoo('^IRX','1d','1mo'),   // 米3ヶ月
      fetchYahoo('^JGB10Y','1d','1mo'), // 日本10年（取れない場合あり）
    ]);
    const [h1r,m15r,m5r,vixR,usdR,tnxR,fvxR,irxR,jgbR]=results;

    const tf1h  = h1r.value;
    const tf15m = m15r.value||tf1h||d1;
    const tf5m  = m5r.value||tf15m;
    const vix   = vixR.value?.closes.at(-1)||null;
    const usd   = usdR.value?.closes.at(-1)||null;
    const usdPrev=usdR.value?.closes.at(-6)||null;
    const tnx   = tnxR.value?.closes.at(-1)||null;
    const tnxPrev=tnxR.value?.closes.at(-11)||null;
    const fvx   = fvxR.value?.closes.at(-1)||null;
    const fvxPrev=fvxR.value?.closes.at(-11)||null;
    const jgb10 = jgbR.value?.closes.at(-1)||null;
    const jgb10Prev=jgbR.value?.closes.at(-11)||null;

    // 現在値
    const cur=d1.closes.at(-1), prev=d1.closes.at(-2);
    const chg=cur-prev, chgP=chg/prev*100;
    document.getElementById('hdrPrice').textContent=fmt(cur);
    document.getElementById('hdrPrice').style.color=chg>=0?'var(--bull)':'var(--bear)';
    document.getElementById('hdrChange').textContent=(chg>=0?'+':'')+fmt(chg)+' ('+pct(chgP)+') 前日比';
    document.getElementById('hdrChange').style.color=chg>=0?'var(--bull)':'var(--bear)';
    const now=new Date();
    document.getElementById('updTime').textContent=now.getHours()+':'+String(now.getMinutes()).padStart(2,'0')+' JST';

    // 週足・月足
    const wkC=[],wkH=[],wkL=[];
    for(let i=0;i+4<d1.closes.length;i+=5){
      wkC.push(d1.closes[i+4]);
      wkH.push(Math.max(...d1.highs.slice(i,i+5)));
      wkL.push(Math.min(...d1.lows.slice(i,i+5)));
    }
    const tf1w=wkC.length>=4?{closes:wkC,highs:wkH,lows:wkL}:null;
    const moC=[],moH=[],moL=[];
    for(let i=0;i+19<d1.closes.length;i+=20){
      moC.push(d1.closes[i+19]);
      moH.push(Math.max(...d1.highs.slice(i,i+20)));
      moL.push(Math.min(...d1.lows.slice(i,i+20)));
    }
    const tf1m=moC.length>=2?{closes:moC,highs:moH,lows:moL}:null;

    // TFシグナル
    const sig5m=tfSignal(tf5m);
    const sig15m=tfSignal(tf15m);
    const sig1h=tfSignal(tf1h);
    const sig1d=tfSignal(d1);
    const sig1w=tfSignal(tf1w);
    const sig1m=tfSignal(tf1m);

    // MA乖離率
    function devCard(maDays, label) {
      const ma=sma(d1.closes,maDays);
      const dv=ma?(cur-ma)/ma*100:null;
      if(dv===null) return card(label+' 乖離率','---','データ不足','neutral');
      let sig='neutral',sub='正常範囲';
      if(dv>7){sig='bear';sub='上方過熱 ⚠ 追い買い注意';}
      else if(dv>4){sig='neutral';sub='やや上方乖離 注意';}
      else if(dv<-7){sig='bull';sub='下方過熱 ⚠ 追い売り注意';}
      else if(dv<-4){sig='neutral';sub='やや下方乖離 注意';}
      return card(label+' 乖離率', pct(dv), 'MA: '+fmt(ma), sig);
    }

    // 騰落レシオ
    function torakuCard(n, label) {
      const tr=toraku(d1.closes,n);
      if(tr===null) return card(label+' 騰落レシオ','---','データ不足','neutral');
      let sig='neutral',sub='中立ゾーン';
      if(tr>=130){sig='bear';sub='買われすぎ ⚠ 高値警戒';}
      else if(tr>=110){sig='bull';sub='強気優勢';}
      else if(tr<=70){sig='bull';sub='売られすぎ ⚠ 反発期待';}
      else if(tr<=90){sig='bear';sub='弱気優勢';}
      return card(label+' 騰落レシオ', tr.toFixed(1), sub, sig);
    }

    // RSI
    const rsiVal=rsi(d1.closes,14);
    let rsiSig='neutral',rsiSub='中立ゾーン';
    if(rsiVal!==null){
      if(rsiVal>=75){rsiSig='bear';rsiSub='買われすぎ ⚠ 反転注意';}
      else if(rsiVal>=60){rsiSig='bull';rsiSub='強気ゾーン';}
      else if(rsiVal<=25){rsiSig='bull';rsiSub='売られすぎ ⚠ 反転注意';}
      else if(rsiVal<=40){rsiSig='bear';rsiSub='弱気ゾーン';}
    }

    // VIX
    let vixSig='neutral',vixSub='---';
    if(vix){
      if(vix>=30){vixSig='bear';vixSub='恐怖 — 急落リスク高';}
      else if(vix>=20){vixSig='neutral';vixSub='警戒ゾーン';}
      else if(vix<=14){vixSig='bull';vixSub='落ち着き — リスクオン';}
      else{vixSig='neutral';vixSub='平常範囲';}
    }

    // 金利カード
    function rateCard(name, val, prevVal, bullThresh, bearThresh, invertLogic) {
      if(!val) return card(name,'---','取得不可','neutral');
      const dir=prevVal?val-prevVal:0;
      const dirStr=dir>0?'↑ 上昇中':dir<0?'↓ 低下中':'→ 横ばい';
      let sig='neutral',sub=val.toFixed(2)+'% '+dirStr;
      if(invertLogic){
        // 株に逆風=金利上昇
        if(val>=bearThresh&&dir>0){sig='bear';sub=val.toFixed(2)+'% ↑ 株に逆風';}
        else if(val>=bearThresh){sig='neutral';sub=val.toFixed(2)+'% 高水準・横ばい';}
        else if(dir<-0.05){sig='bull';sub=val.toFixed(2)+'% ↓ 株に追い風';}
      } else {
        if(dir>0.05){sig='neutral';sub=val.toFixed(2)+'% ↑ 上昇中';}
        else if(dir<-0.05){sig='neutral';sub=val.toFixed(2)+'% ↓ 低下中';}
      }
      return card(name, val.toFixed(2)+'%', sub, sig);
    }

    // ドル円
    let usdSig='neutral',usdSub='---';
    if(usd){
      const usdDir=usdPrev?usd-usdPrev:0;
      if(usdDir>1){usdSig='bull';usdSub='円安進行 — 先物に追い風';}
      else if(usdDir<-1){usdSig='bear';usdSub='円高進行 — 先物に逆風';}
      else{usdSig='neutral';usdSub=usdDir>0?'やや円安':'やや円高';}
    }

    // ===== RENDER =====
    let html='';

    html+='<div class="sec-lbl">テクニカル — タイムフレーム別トレンド</div>';
    html+=card('5分足',  sig5m.label,  sig5m.sub,  sig5m.signal);
    html+=card('15分足', sig15m.label, sig15m.sub, sig15m.signal);
    html+=card('1時間足', sig1h.label,  sig1h.sub,  sig1h.signal);
    html+=card('日足 (1D)', sig1d.label, sig1d.sub, sig1d.signal);
    html+=card('週足 (1W)', sig1w.label, sig1w.sub, sig1w.signal);
    html+=card('月足 (1M)', sig1m.label, sig1m.sub, sig1m.signal);

    html+='<div class="sec-lbl">テクニカル指標</div>';
    html+=devCard(5,  '5日MA');
    html+=devCard(13, '13日MA');
    html+=devCard(25, '25日MA');
    html+=torakuCard(6,  '6日');
    html+=torakuCard(10, '10日');
    html+=torakuCard(25, '25日');
    html+=card('RSI (14日)', rsiVal!==null?rsiVal.toFixed(1):'---', rsiSub, rsiSig);

    html+='<div class="sec-lbl">マクロ指標</div>';
    html+=card('VIX 恐怖指数', vix?vix.toFixed(2):'---', vixSub, vixSig);
    html+=card('ドル円', usd?usd.toFixed(2):'---', usdSub, usdSig);
    html+=rateCard('米10年金利', tnx, tnxPrev, 4.5, 4.5, true);
    html+=rateCard('米5年金利',  fvx, fvxPrev, 4.0, 4.0, true);
    html+=rateCard('日本10年金利', jgb10, jgb10Prev, 1.5, 1.5, true);

    app.innerHTML=html;

  } catch(e) {
    document.getElementById('app').innerHTML=
      '<div class="err">⚠ '+e.message+'<br><br><span style="font-size:10px;opacity:.6">↻ボタンで再試行</span></div>';
  }
}

// 自動更新
let _timer=null;
function setAuto(sec){
  if(_timer){clearInterval(_timer);_timer=null;}
  localStorage.setItem('auto_refresh',sec);
  if(parseInt(sec)>0) _timer=setInterval(loadAll,parseInt(sec)*1000);
}
const _s=localStorage.getItem('auto_refresh')||'0';
document.getElementById('autoSel').value=_s;
if(parseInt(_s)>0) _timer=setInterval(loadAll,parseInt(_s)*1000);

loadAll();
</script>
</body>
</html>
