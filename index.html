
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="N225 Chart">
<link rel="apple-touch-icon" href="icon.jpg">
<title>N225 Chart</title>
<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#080a0d;--surface:#111418;--border:#1e2530;
  --text:#d8e4f0;--dim:#4a5a6e;--mono:'Share Tech Mono',monospace;
  --bull:#ff3d5a;--bear:#00c4ff;--gold:#f5c842;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
body{background:var(--bg);color:var(--text);font-family:var(--mono);overflow-x:hidden;}

#toolbar{
  position:sticky;top:0;z-index:100;
  background:rgba(8,10,13,.97);backdrop-filter:blur(10px);
  border-bottom:1px solid var(--border);
  padding:8px 10px;display:flex;flex-direction:column;gap:8px;
}
.tb-row{display:flex;align-items:center;gap:6px;flex-wrap:wrap;}
.tb-btn{
  height:34px;padding:0 12px;border-radius:5px;border:1px solid var(--border);
  background:var(--surface);color:var(--dim);font-family:var(--mono);font-size:12px;
  cursor:pointer;white-space:nowrap;transition:all .15s;
}
.tb-btn.active{background:rgba(245,200,66,.15);border-color:var(--gold);color:var(--gold);}
.tb-btn.danger{color:#ff6060;}
.sym-btn{height:34px;padding:0 14px;border-radius:5px;border:1px solid var(--border);
  background:var(--surface);color:var(--dim);font-family:var(--mono);font-size:12px;cursor:pointer;}
.sym-btn.active{background:rgba(245,200,66,.12);border-color:var(--gold);color:var(--gold);}
.tb-sep{width:1px;height:26px;background:var(--border);flex-shrink:0;}
.color-dot{width:24px;height:24px;border-radius:50%;cursor:pointer;
  border:2px solid transparent;transition:border-color .15s;flex-shrink:0;}
.color-dot.active{border-color:#fff;box-shadow:0 0 0 1px #fff;}
.sty-btn{height:26px;padding:0 10px;border-radius:3px;border:1px solid var(--border);
  background:var(--surface);color:var(--dim);font-family:var(--mono);font-size:11px;cursor:pointer;}
.sty-btn.active{border-color:var(--gold);color:var(--gold);}

.chart-wrap{position:relative;border-bottom:1px solid var(--border);}
canvas{display:block;width:100%;touch-action:none;cursor:crosshair;}
canvas.tool-none{cursor:default;}
.price-tag{position:absolute;right:0;font-size:10px;font-family:var(--mono);
  background:var(--gold);color:#000;padding:1px 5px;border-radius:2px 0 0 2px;
  pointer-events:none;z-index:10;transform:translateY(-50%);font-weight:bold;}
.tf-label{position:absolute;top:6px;left:8px;font-size:10px;color:var(--dim);
  background:rgba(8,10,13,.8);padding:2px 6px;border-radius:2px;pointer-events:none;z-index:5;letter-spacing:1px;}

/* Delete sheet */
#delSheet{display:none;position:fixed;inset:0;z-index:200;background:rgba(0,0,0,.75);}
#delSheet.open{display:flex;align-items:flex-end;}
.sheet-body{width:100%;background:#161b22;border-top:1px solid var(--border);
  border-radius:14px 14px 0 0;padding:16px;max-height:65vh;overflow-y:auto;}
.sheet-title{font-size:11px;color:var(--dim);letter-spacing:3px;text-align:center;margin-bottom:14px;}
.del-item{display:flex;align-items:center;gap:10px;padding:11px 12px;
  background:rgba(255,255,255,.04);border:1px solid var(--border);border-radius:6px;margin-bottom:7px;cursor:pointer;}
.del-item:active{background:rgba(255,61,90,.12);}
.del-swatch{width:36px;height:3px;border-radius:2px;flex-shrink:0;}
.del-info{flex:1;font-size:12px;}
.del-sub{font-size:10px;color:var(--dim);margin-top:2px;}
.del-x{color:var(--bull);font-size:18px;padding:0 2px;}
.btn-all{width:100%;margin-top:10px;padding:13px;border-radius:7px;
  background:rgba(255,61,90,.12);border:1px solid rgba(255,61,90,.35);
  color:var(--bull);font-family:var(--mono);font-size:13px;cursor:pointer;}
.btn-cancel{width:100%;margin-top:7px;padding:11px;border-radius:7px;
  background:var(--surface);border:1px solid var(--border);
  color:var(--dim);font-family:var(--mono);font-size:12px;cursor:pointer;}
</style>
</head>
<body>
<div id="toolbar">
  <div class="tb-row">
    <button class="sym-btn active" data-sym="NKD=F" onclick="setSym(this)">225先物</button>
    <button class="sym-btn" data-sym="1570.T" onclick="setSym(this)">1570</button>
    <button class="sym-btn" data-sym="1579.T" onclick="setSym(this)">1579</button>
    <div class="tb-sep"></div>
    <button class="tb-btn" onclick="loadAll()">↻ 更新</button>
    <span id="updTime" style="font-size:10px;color:var(--dim);margin-left:auto">---</span>
  </div>
  <div class="tb-row">
    <button class="tb-btn active" data-tool="none" onclick="setTool(this)">✋ 移動</button>
    <button class="tb-btn" data-tool="line" onclick="setTool(this)">╱ 直線</button>
    <button class="tb-btn" data-tool="hline" onclick="setTool(this)">― 水平線</button>
    <button class="tb-btn" data-tool="channel" onclick="setTool(this)">⫛ チャネル</button>
    <div class="tb-sep"></div>
    <button class="tb-btn danger" onclick="openDel()">🗑</button>
  </div>
  <div class="tb-row">
    <div class="color-dot active" style="background:#ffffff" data-color="#ffffff" onclick="setColor(this)"></div>
    <div class="color-dot" style="background:#ff3d5a" data-color="#ff3d5a" onclick="setColor(this)"></div>
    <div class="color-dot" style="background:#00c4ff" data-color="#00c4ff" onclick="setColor(this)"></div>
    <div class="color-dot" style="background:#f5c842" data-color="#f5c842" onclick="setColor(this)"></div>
    <div class="color-dot" style="background:#44ff88" data-color="#44ff88" onclick="setColor(this)"></div>
    <div class="color-dot" style="background:#ff8844" data-color="#ff8844" onclick="setColor(this)"></div>
    <div class="color-dot" style="background:#cc88ff" data-color="#cc88ff" onclick="setColor(this)"></div>
    <input type="color" id="colorPicker" value="#ffffff"
      style="width:24px;height:24px;border:none;border-radius:50%;cursor:pointer;padding:0;background:none;"
      onchange="setColorHex(this.value)">
    <div class="tb-sep"></div>
    <button class="sty-btn active" data-sty="solid" onclick="setStyle(this)">実線</button>
    <button class="sty-btn" data-sty="dash" onclick="setStyle(this)">点線</button>
  </div>
</div>

<div id="charts">
  <div class="chart-wrap"><div class="tf-label">日足</div><canvas id="cv_1d"></canvas><div class="price-tag" id="tag_1d"></div></div>
  <div class="chart-wrap"><div class="tf-label">60分足</div><canvas id="cv_1h"></canvas><div class="price-tag" id="tag_1h"></div></div>
  <div class="chart-wrap"><div class="tf-label">15分足</div><canvas id="cv_15m"></canvas><div class="price-tag" id="tag_15m"></div></div>
  <div class="chart-wrap"><div class="tf-label">5分足</div><canvas id="cv_5m"></canvas><div class="price-tag" id="tag_5m"></div></div>
</div>

<div id="delSheet" onclick="closeDel()">
  <div class="sheet-body" onclick="event.stopPropagation()">
    <div class="sheet-title">ラインを削除</div>
    <div id="delList"></div>
    <button class="btn-all" onclick="deleteAll()">🗑 全ライン削除</button>
    <button class="btn-cancel" onclick="closeDel()">キャンセル</button>
  </div>
</div>

<script>
// ===== CONFIG =====
const TFS = [
  {id:'1d',  label:'日足',   interval:'1d',  range:'6mo', h:190},
  {id:'1h',  label:'60分足', interval:'1h',  range:'5d',  h:170},
  {id:'15m', label:'15分足', interval:'15m', range:'2d',  h:160},
  {id:'5m',  label:'5分足',  interval:'5m',  range:'1d',  h:160},
];
const PAD = {l:4, r:54, t:10, b:20};

// ===== STATE =====
let SYM   = 'NKD=F';
let TOOL  = 'none';
let COLOR = '#ffffff';
let STYLE = 'solid';
let DATA  = {};   // tfId → {closes,highs,lows,opens,times}
let LINES = [];   // saved lines (price+time based)
let DRAW  = null; // in-progress drawing

// ===== STORAGE =====
function storageKey(){ return 'n225_lines_v3_'+SYM; }
function saveLines(){ try{ localStorage.setItem(storageKey(), JSON.stringify(LINES)); }catch{} }
function loadLines(){ try{ LINES = JSON.parse(localStorage.getItem(storageKey())||'[]'); }catch{ LINES=[]; } }

// ===== FETCH =====
async function fetchYahoo(sym, interval, range){
  const base = 'https://query1.finance.yahoo.com/v8/finance/chart/';
  const url  = base + encodeURIComponent(sym)
    + '?interval='+interval+'&range='+range+'&includePrePost=false';
  const ctrl = new AbortController();
  const t = setTimeout(()=>ctrl.abort(), 9000);
  try {
    const r = await fetch('https://corsproxy.io/?'+encodeURIComponent(url),{signal:ctrl.signal});
    clearTimeout(t);
    if(!r.ok) return null;
    const j = await r.json();
    const res = j?.chart?.result?.[0];
    const q   = res?.indicators?.quote?.[0];
    const ts  = res?.timestamp || [];
    if(!q) return null;
    const len = ts.length;
    // align all arrays to timestamp length
    const closes = (q.close||[]).slice(0,len).map((v,i)=>v!=null&&!isNaN(v)?v:null);
    const highs  = (q.high ||[]).slice(0,len).map((v,i)=>v!=null&&!isNaN(v)?v:null);
    const lows   = (q.low  ||[]).slice(0,len).map((v,i)=>v!=null&&!isNaN(v)?v:null);
    const opens  = (q.open ||[]).slice(0,len).map((v,i)=>v!=null&&!isNaN(v)?v:null);
    // filter out null bars
    const bars = [];
    for(let i=0;i<len;i++){
      if(closes[i]!=null && highs[i]!=null && lows[i]!=null){
        bars.push({t:ts[i], o:opens[i]||closes[i], h:highs[i], l:lows[i], c:closes[i]});
      }
    }
    if(bars.length<2) return null;
    return bars;
  } catch { clearTimeout(t); return null; }
}

// ===== LOAD =====
async function loadAll(){
  document.getElementById('updTime').textContent='取得中...';
  const results = await Promise.allSettled(TFS.map(tf=>fetchYahoo(SYM,tf.interval,tf.range)));
  TFS.forEach((tf,i)=>{ DATA[tf.id] = results[i].value || null; });
  loadLines();
  renderAll();
  const n=new Date();
  document.getElementById('updTime').textContent=n.getHours()+':'+String(n.getMinutes()).padStart(2,'0');
}

function setSym(btn){
  SYM = btn.dataset.sym;
  document.querySelectorAll('.sym-btn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  loadAll();
}

// ===== COORDINATE HELPERS =====
// Each chart has its own time/price scale derived from its data
function getScale(tfId){
  const bars = DATA[tfId];
  if(!bars||bars.length<2) return null;
  const cv  = document.getElementById('cv_'+tfId);
  const tf  = TFS.find(t=>t.id===tfId);
  const W   = cv.offsetWidth, H = tf.h;
  const cw  = W-PAD.l-PAD.r, ch = H-PAD.t-PAD.b;
  const n   = bars.length;
  const minP= Math.min(...bars.map(b=>b.l));
  const maxP= Math.max(...bars.map(b=>b.h));
  const vr  = maxP-minP||1;
  const minT= bars[0].t, maxT= bars[n-1].t, tr=maxT-minT||1;
  return {bars,W,H,cw,ch,n,minP,maxP,vr,minT,maxT,tr};
}

function priceToY(price,sc){ return PAD.t + sc.ch - (price-sc.minP)/sc.vr*sc.ch; }
function timeToX(ts,sc){
  // clamp to visible range
  const frac = (ts-sc.minT)/sc.tr;
  return PAD.l + frac*sc.cw;
}
function xToTime(x,sc){ return sc.minT + (x-PAD.l)/sc.cw*sc.tr; }
function yToPrice(y,sc){ return sc.maxP - (y-PAD.t)/sc.ch*sc.vr; }

// ===== RENDER =====
function renderAll(){ TFS.forEach(tf=>renderChart(tf.id)); }

function renderChart(tfId){
  const cv  = document.getElementById('cv_'+tfId);
  const tf  = TFS.find(t=>t.id===tfId);
  if(!cv||!tf) return;
  const dpr = window.devicePixelRatio||1;
  const W   = cv.offsetWidth||window.innerWidth, H = tf.h;
  cv.width  = W*dpr; cv.height = H*dpr; cv.style.height=H+'px';
  const ctx = cv.getContext('2d');
  ctx.scale(dpr,dpr);

  // background
  ctx.fillStyle='#080a0d'; ctx.fillRect(0,0,W,H);

  const bars = DATA[tfId];
  if(!bars){
    ctx.fillStyle='#4a5a6e'; ctx.font='12px Share Tech Mono'; ctx.textAlign='center';
    ctx.fillText('データ取得中...', W/2, H/2);
    return;
  }

  const sc = getScale(tfId);
  if(!sc) return;

  // grid
  ctx.strokeStyle='rgba(30,37,48,.7)'; ctx.lineWidth=.5;
  for(let i=0;i<=4;i++){
    const yy=PAD.t+(sc.ch/4)*i;
    ctx.beginPath(); ctx.moveTo(PAD.l,yy); ctx.lineTo(W-PAD.r,yy); ctx.stroke();
    const p = sc.maxP-(sc.vr/4)*i;
    ctx.fillStyle='#4a5a6e'; ctx.font='9px Share Tech Mono'; ctx.textAlign='left';
    ctx.fillText(Math.round(p).toLocaleString(), W-PAD.r+3, yy+3);
  }

  // candles
  const bw = Math.max(1, sc.cw/sc.n*0.55);
  bars.forEach((bar,i)=>{
    const cx = PAD.l + (i+0.5)/sc.n*sc.cw;
    const bull = bar.c >= bar.o;
    ctx.strokeStyle = ctx.fillStyle = bull?'#ff3d5a':'#00c4ff';
    ctx.lineWidth=1;
    ctx.beginPath(); ctx.moveTo(cx,priceToY(bar.h,sc)); ctx.lineTo(cx,priceToY(bar.l,sc)); ctx.stroke();
    const y1=priceToY(Math.max(bar.o,bar.c),sc), y2=priceToY(Math.min(bar.o,bar.c),sc);
    ctx.fillRect(cx-bw/2, y1, bw, Math.max(1,y2-y1));
  });

  // current price line
  const cur = bars.at(-1).c;
  ctx.strokeStyle='rgba(245,200,66,.45)'; ctx.lineWidth=.8; ctx.setLineDash([3,4]);
  ctx.beginPath(); ctx.moveTo(PAD.l,priceToY(cur,sc)); ctx.lineTo(W-PAD.r,priceToY(cur,sc)); ctx.stroke();
  ctx.setLineDash([]);
  const tag=document.getElementById('tag_'+tfId);
  if(tag){ tag.textContent=Math.round(cur).toLocaleString(); tag.style.top=priceToY(cur,sc)+'px'; }

  // ===== SAVED LINES =====
  LINES.forEach(line=>drawLineFull(ctx,line,sc,W,H,false));

  // ===== IN-PROGRESS =====
  if(DRAW && DRAW.tfId===tfId) drawLineFull(ctx,DRAW,sc,W,H,true);
}

function drawLineFull(ctx, line, sc, W, H, preview){
  ctx.save();
  ctx.strokeStyle = line.color||'#ffffff';
  ctx.lineWidth   = preview ? 1.2 : 1.5;
  ctx.globalAlpha = preview ? 0.65 : 1;
  ctx.setLineDash(line.style==='dash'?[6,4]:[]);

  if(line.type==='hline'){
    const y = priceToY(line.p1Price, sc);
    if(y<PAD.t-4||y>PAD.t+sc.ch+4){ ctx.restore(); return; }
    ctx.beginPath(); ctx.moveTo(PAD.l,y); ctx.lineTo(W-PAD.r,y); ctx.stroke();
    // label
    ctx.font='9px Share Tech Mono'; ctx.fillStyle=line.color; ctx.textAlign='left';
    ctx.fillText(Math.round(line.p1Price).toLocaleString(), W-PAD.r+3, y+3);

  } else if(line.type==='line'){
    // finite line: from p1(time,price) to p2(time,price)
    const x1=timeToX(line.p1Time,sc), y1=priceToY(line.p1Price,sc);
    const x2=timeToX(line.p2Time,sc), y2=priceToY(line.p2Price,sc);
    ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(x2,y2); ctx.stroke();

  } else if(line.type==='channel'){
    if(line.phase===1||preview){
      // phase1: just draw first line
      const x1=timeToX(line.p1Time,sc), y1=priceToY(line.p1Price,sc);
      const x2=timeToX(line.p2Time,sc), y2=priceToY(line.p2Price,sc);
      ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(x2,y2); ctx.stroke();
    }
    if(line.phase===2){
      // both lines drawn
      const x1=timeToX(line.p1Time,sc), y1=priceToY(line.p1Price,sc);
      const x2=timeToX(line.p2Time,sc), y2=priceToY(line.p2Price,sc);
      const offY= (line.p3Price-line.p1Price)*sc.ch/sc.vr; // pixel offset
      ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(x2,y2); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(x1,y1-offY); ctx.lineTo(x2,y2-offY); ctx.stroke();
      // fill
      ctx.globalAlpha=0.07;
      ctx.fillStyle=line.color;
      ctx.beginPath();
      ctx.moveTo(x1,y1); ctx.lineTo(x2,y2);
      ctx.lineTo(x2,y2-offY); ctx.lineTo(x1,y1-offY);
      ctx.closePath(); ctx.fill();
    }
  }

  ctx.setLineDash([]); ctx.restore();
}

// ===== TOUCH HANDLING =====
// Channel drawing has 2 phases:
// Phase 1: draw first line (p1→p2), tap end to confirm
// Phase 2: move finger to set parallel distance, tap to finish

TFS.forEach(tf=>{
  const cv = document.getElementById('cv_'+tf.id);
  if(!cv) return;

  function getPos(e){
    const rect=cv.getBoundingClientRect();
    const src=e.touches?e.touches[0]:e;
    return {x:src.clientX-rect.left, y:src.clientY-rect.top};
  }

  function onStart(e){
    if(TOOL==='none') return;
    e.preventDefault();
    const pos=getPos(e);
    const sc=getScale(tf.id);
    if(!sc) return;
    const t=xToTime(pos.x,sc), p=yToPrice(pos.y,sc);

    if(TOOL==='channel' && DRAW && DRAW.type==='channel' && DRAW.phase===1){
      // Channel phase 2: set p3 (parallel offset)
      DRAW.phase=2;
      DRAW.p3Price=p;
      DRAW.p3Time=t;
      DRAW.tfId=tf.id;
    } else {
      DRAW={type:TOOL, tfId:tf.id, color:COLOR, style:STYLE,
        p1Time:t, p1Price:p, p2Time:t, p2Price:p,
        phase:TOOL==='channel'?1:undefined};
    }
    renderAll();
  }

  function onMove(e){
    if(!DRAW) return;
    e.preventDefault();
    const pos=getPos(e);
    const sc=getScale(tf.id);
    if(!sc) return;
    const t=xToTime(pos.x,sc), p=yToPrice(pos.y,sc);

    if(DRAW.type==='channel' && DRAW.phase===2){
      DRAW.p3Price=p; DRAW.p3Time=t;
    } else {
      DRAW.p2Time=t; DRAW.p2Price=p;
    }
    renderAll();
  }

  function onEnd(e){
    if(!DRAW) return;
    e.preventDefault();

    if(DRAW.type==='channel' && DRAW.phase===1){
      // wait for second touch to set parallel line — do nothing on end of phase1
      return;
    }
    if(DRAW.type==='channel' && DRAW.phase===2){
      // finalize channel
      const line={...DRAW, id:Date.now()};
      LINES.push(line);
      saveLines();
      DRAW=null;
      renderAll();
      return;
    }

    // line or hline
    const dist=Math.hypot(DRAW.p2Time-DRAW.p1Time, DRAW.p2Price-DRAW.p1Price);
    if(Math.abs(DRAW.p2Price-DRAW.p1Price)<1 && DRAW.type!=='hline') {
      // too small - treat as tap, cancel
      DRAW=null; renderAll(); return;
    }
    const line={...DRAW, id:Date.now()};
    LINES.push(line);
    saveLines();
    DRAW=null;
    renderAll();
  }

  cv.addEventListener('touchstart', onStart, {passive:false});
  cv.addEventListener('touchmove',  onMove,  {passive:false});
  cv.addEventListener('touchend',   onEnd,   {passive:false});
  cv.addEventListener('mousedown',  onStart);
  cv.addEventListener('mousemove',  e=>{if(e.buttons)onMove(e);});
  cv.addEventListener('mouseup',    onEnd);
});

// ===== TOOLBAR =====
function setTool(btn){
  TOOL=btn.dataset.tool;
  DRAW=null;
  document.querySelectorAll('.tb-btn[data-tool]').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  // cursor
  document.querySelectorAll('canvas').forEach(cv=>{
    cv.style.cursor = TOOL==='none'?'default':'crosshair';
  });
  renderAll();
}
function setColor(dot){
  COLOR=dot.dataset.color;
  document.querySelectorAll('.color-dot').forEach(d=>d.classList.remove('active'));
  dot.classList.add('active');
  document.getElementById('colorPicker').value=COLOR;
}
function setColorHex(c){
  COLOR=c;
  document.querySelectorAll('.color-dot').forEach(d=>d.classList.remove('active'));
}
function setStyle(btn){
  STYLE=btn.dataset.sty;
  document.querySelectorAll('.sty-btn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
}

// ===== DELETE =====
function openDel(){
  const list=document.getElementById('delList');
  if(!LINES.length){
    list.innerHTML='<div style="text-align:center;color:var(--dim);padding:20px;font-size:12px">ラインがありません</div>';
  } else {
    const typeLabel={line:'直線',hline:'水平線',channel:'チャネル'};
    list.innerHTML=LINES.map((l,i)=>{
      const dashStyle = l.style==='dash'
        ? `background:repeating-linear-gradient(90deg,${l.color} 0,${l.color} 6px,transparent 6px,transparent 10px)`
        : `background:${l.color}`;
      return `<div class="del-item" onclick="deleteLine(${i})">
        <div class="del-swatch" style="${dashStyle}"></div>
        <div class="del-info">${typeLabel[l.type]||l.type}
          <div class="del-sub">${Math.round(l.p1Price).toLocaleString()} 付近</div>
        </div>
        <div class="del-x">✕</div>
      </div>`;
    }).join('');
  }
  document.getElementById('delSheet').classList.add('open');
}
function closeDel(){ document.getElementById('delSheet').classList.remove('open'); }
function deleteLine(i){ LINES.splice(i,1); saveLines(); renderAll(); openDel(); }
function deleteAll(){ LINES=[]; saveLines(); renderAll(); closeDel(); }

window.addEventListener('resize',()=>renderAll());
loadAll();
</script>
